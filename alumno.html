<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mon Espace DELF | Réussite</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --oxford: #002147; --gold: #C5A059; --cream: #F8F9FA; --green: #28A745; }
        body { font-family: 'Montserrat', sans-serif; margin: 0; display: flex; height: 100vh; background: var(--cream); overflow: hidden; }
        .sidebar { width: 280px; background: var(--oxford); color: white; padding: 30px 20px; flex-shrink: 0; }
        .skill-btn { width: 100%; padding: 15px; margin-bottom: 10px; border-radius: 10px; border: 1px solid rgba(197, 160, 89, 0.3); background: transparent; color: white; cursor: pointer; text-align: left; display: flex; align-items: center; gap: 12px; }
        .skill-btn.active { background: var(--gold); color: var(--oxford); font-weight: 700; }
        .header { background: white; padding: 20px 40px; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; }
        .workspace { flex: 1; padding: 40px; overflow-y: auto; display: grid; grid-template-columns: 2fr 1fr; gap: 30px; }
        .card { background: white; padding: 35px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.03); }
        .progress-bar { height: 8px; background: #eee; border-radius: 10px; width: 200px; overflow: hidden; margin-top: 5px; }
        .progress-fill { height: 100%; background: var(--green); width: 0%; transition: 1s; }
        .unit-box { border-left: 4px solid var(--gold); padding: 15px; margin-bottom: 25px; background: #fff; border-radius: 0 10px 10px 0; }
    </style>
</head>
<body>
    <aside class="sidebar">
        <h2 style="color:var(--gold); font-size:1rem; text-align:center;">RÉUSSITE DELF</h2>
        <button class="skill-btn active" onclick="loadSkill('PARCOURS', this)"><i class="fas fa-route"></i> Mon Parcours</button>
        <button class="skill-btn" onclick="loadSkill('CARNET', this)"><i class="fas fa-list-check"></i> Mon Carnet</button>
    </aside>

    <main style="flex:1; display:flex; flex-direction:column; overflow:hidden;">
        <header class="header">
            <div>
                <strong>Bonjour, <span id="st-name" style="color:var(--gold);">...</span></strong>
                <div class="progress-bar"><div id="st-progress" class="progress-fill"></div></div>
            </div>
            <div style="display:flex; gap:30px; align-items:center;">
                <div style="text-align:center;"><small>NIVEAU</small><div id="st-level" style="font-weight:700;">--</div></div>
                <div style="text-align:center;"><div id="st-days" style="font-size:1.5rem; font-weight:700; color:var(--green);">0</div><small>JOURS RESTANTS</small></div>
            </div>
        </header>

        <section class="workspace">
            <div id="main-content" class="card">Chargement...</div>
            <div class="card" style="background:var(--oxford); color:white;">
                <h4 style="color:var(--gold);">Sophia Tips</h4>
                <p id="tips-area" style="font-size:0.85rem;">Bienvenue dans votre préparation personnalisée.</p>
            </div>
        </section>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyCgog8tKspHy01ZHE8Dthl9O4W6lw1a_Ec", authDomain: "objectif-reussite-delf.firebaseapp.com", projectId: "objectif-reussite-delf", storageBucket: "objectif-reussite-delf.firebasestorage.app", messagingSenderId: "942279633770", appId: "1:942279633770:web:687ba6d819747eb29c1313" };
        const app = initializeApp(firebaseConfig); const db = getFirestore(app);

        const studentId = new URLSearchParams(window.location.search).get('id');
        let currentLevel = "";

        async function init() {
            if(!studentId) return;
            const snap = await getDoc(doc(db, "Usuarios", studentId.toLowerCase().trim()));
            if(snap.exists()){
                const d = snap.data();
                currentLevel = d.nivel;
                document.getElementById('st-name').innerText = d.nombre;
                document.getElementById('st-level').innerText = d.nivel;
                document.getElementById('st-progress').style.width = d.progreso + "%";
                
                if(d.fecha_certificacion) {
                    const diff = Math.ceil((new Date(d.fecha_certificacion) - new Date()) / (1000 * 60 * 60 * 24));
                    document.getElementById('st-days').innerText = diff > 0 ? diff : 0;
                }
                loadSkill('PARCOURS', document.querySelector('.skill-btn.active'));
            }
        }

        window.loadSkill = async (skill, btn) => {
            document.querySelectorAll('.skill-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const area = document.getElementById('main-content');
            
            const snap = await getDoc(doc(db, "BibliotecaEjercicios", currentLevel));
            if(!snap.exists()) {
                area.innerHTML = "Material en preparación para el nivel " + currentLevel;
                return;
            }

            const data = snap.data();
            if(skill === 'PARCOURS') {
                area.innerHTML = `<h3>Votre Itinéraire ${currentLevel}</h3>`;
                (data.itinerario || []).forEach(u => {
                    const ejercicios = u.ejercicios || u.objectifs || [];
                    area.innerHTML += `
                        <div class="unit-box">
                            <strong>Unité ${u.unite || u.unidad}:</strong> ${u.tema || u.titulo}
                            <ul>
                                ${Array.isArray(ejercicios) ? ejercicios.map(e => `<li>${e}</li>`).join('') : `<li>${ejercicios}</li>`}
                            </ul>
                        </div>`;
                });
            } else if(skill === 'CARNET') {
                area.innerHTML = `<h3>Carnet de Bord</h3>`;
                (data.Checklist || []).forEach(i => {
                    const items = i.items || i.descripteurs_b1 || [];
                    area.innerHTML += `
                        <div style="padding:15px; border-bottom:1px solid #eee;">
                            <strong>${i.tema || i.competence}</strong>
                            <ul style="margin:5px 0 0 0; padding-left:20px; font-size:0.85rem; color:#666;">
                                ${Array.isArray(items) ? items.map(it => `<li>${it}</li>`).join('') : `<li>${items}</li>`}
                            </ul>
                        </div>`;
                });
            }
        };
        init();
    </script>
</body>
</html>
