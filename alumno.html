<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mon Espace DELF | Réussite</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
        :root { 
            --oxford: #002147; 
            --gold: #C5A059; 
            --cream: #F8F9FA; 
            --green: #28A745; 
            --dark-blue: #001530;
        }
        
        body { 
            font-family: 'Montserrat', sans-serif; 
            margin: 0; 
            display: flex; 
            height: 100vh; 
            background: var(--cream); 
            overflow: hidden; 
        }
        
        .sidebar { 
            width: 290px; 
            background: var(--oxford); 
            color: white; 
            padding: 30px 15px; 
            flex-shrink: 0; 
            display: flex; 
            flex-direction: column; 
            box-shadow: 4px 0 15px rgba(0,0,0,0.1);
        }
        
        .logo-area { 
            text-align: center; 
            margin-bottom: 35px; 
            border-bottom: 1px solid rgba(255,255,255,0.1); 
            padding-bottom: 20px;
        }
        
        .logo-area h2 { 
            margin: 0; 
            font-size: 1.3rem; 
            letter-spacing: 1px; 
            color: white;
        }
        
        .logo-area span { 
            color: var(--gold); 
            font-size: 0.8rem; 
            font-weight: 300; 
            text-transform: uppercase;
        }
        
        .main-tabs { 
            display: flex; 
            gap: 5px; 
            margin-bottom: 25px; 
            background: rgba(0,0,0,0.2); 
            padding: 5px; 
            border-radius: 8px;
        }
        
        .tab-trigger { 
            flex: 1; 
            background: none; 
            border: none; 
            color: rgba(255,255,255,0.6); 
            padding: 10px; 
            font-size: 0.85rem; 
            cursor: pointer; 
            font-weight: 600; 
            border-radius: 6px; 
            transition: all 0.3s;
        }
        
        .tab-trigger.active { 
            background: var(--gold); 
            color: var(--oxford); 
        }
        
        .menu-scroll { 
            flex: 1; 
            overflow-y: auto; 
            padding-right: 5px;
        }
        
        .menu-scroll::-webkit-scrollbar { 
            width: 5px; 
        }
        
        .menu-scroll::-webkit-scrollbar-thumb { 
            background: rgba(255,255,255,0.2); 
            border-radius: 4px; 
        }
        
        .unit-bloc { 
            margin-bottom: 12px; 
            background: rgba(255,255,255,0.03); 
            border-radius: 8px; 
            overflow: hidden; 
            border: 1px solid rgba(255,255,255,0.05);
        }
        
        .unit-header { 
            width: 100%; 
            background: none; 
            border: none; 
            color: white; 
            padding: 14px 15px; 
            text-align: left; 
            font-size: 0.9rem; 
            font-weight: 600; 
            cursor: pointer; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            transition: background 0.3s;
        }
        
        .unit-header:hover { 
            background: rgba(255,255,255,0.08); 
        }
        
        .unit-header.active-unit { 
            border-left: 4px solid var(--gold); 
            background: rgba(255,255,255,0.05);
        }
        
        .act-list { 
            background: rgba(0,0,0,0.2); 
            padding: 6px 0;
        }
        
        .act-item { 
            width: 100%; 
            background: none; 
            border: none; 
            color: rgba(255,255,255,0.7); 
            padding: 9px 20px; 
            text-align: left; 
            font-size: 0.82rem; 
            cursor: pointer; 
            transition: all 0.2s; 
            display: flex; 
            align-items: center; 
            gap: 8px;
        }
        
        .act-item:hover { 
            color: white; 
            background: rgba(255,255,255,0.05); 
        }
        
        .act-item.active-act { 
            color: var(--gold); 
            font-weight: 700; 
            background: rgba(197,160,89,0.1);
        }
        
        .app-body { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden;
        }
        
        .top-navbar { 
            background: white; 
            height: 75px; 
            display: flex; 
            align-items: center; 
            padding: 0 40px; 
            justify-content: space-between; 
            border-bottom: 1px solid #EAEAEA; 
            flex-shrink: 0;
        }
        
        .skills-selector { 
            display: flex; 
            gap: 8px; 
        }
        
        .skill-pill { 
            background: #F0F2F5; 
            border: none; 
            color: #555; 
            padding: 9px 18px; 
            font-size: 0.82rem; 
            font-weight: 600; 
            border-radius: 30px; 
            cursor: pointer; 
            transition: all 0.3s; 
            display: flex; 
            align-items: center; 
            gap: 8px;
        }
        
        .skill-pill:hover { 
            background: #E4E6EB; 
        }
        
        .skill-pill.active { 
            background: var(--oxford); 
            color: white; 
        }
        
        .content-workspace { 
            flex: 1; 
            display: flex; 
            overflow: hidden; 
            background: #F1F3F6;
        }
        
        .panel-left { 
            flex: 1; 
            overflow-y: auto; 
            padding: 40px; 
            display: flex; 
            flex-direction: column; 
            gap: 30px;
        }
        
        .panel-right { 
            width: 450px; 
            background: white; 
            border-left: 1px solid #EAEAEA; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            flex-shrink: 0;
        }
        
        .right-header { 
            padding: 20px; 
            border-bottom: 1px solid #EAEAEA; 
            font-weight: 700; 
            color: var(--oxford); 
            font-size: 0.95rem; 
            background: var(--cream);
        }
        
        .right-scroll { 
            flex: 1; 
            overflow-y: auto; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            gap: 15px;
        }
        
        .workspace-card { 
            background: white; 
            border-radius: 12px; 
            padding: 35px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.03); 
            border: 1px solid #EAEAEA;
        }
        
        .workspace-card h3 { 
            margin-top: 0; 
            margin-bottom: 25px; 
            color: var(--oxford); 
            font-size: 1.15rem; 
            border-bottom: 2px solid #F1F3F6; 
            padding-bottom: 15px;
        }
        
        .q-wrapper { 
            margin-bottom: 30px; 
            background: #F8F9FA; 
            padding: 20px; 
            border-radius: 10px; 
            border: 1px solid #EAEAEA;
        }
        
        .q-text { 
            font-weight: 600; 
            font-size: 0.95rem; 
            color: var(--oxford); 
            margin-bottom: 15px;
        }
        
        .opts-list { 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
        }
        
        .opt-row { 
            display: flex; 
            align-items: center; 
            background: white; 
            padding: 12px 15px; 
            border-radius: 8px; 
            border: 1px solid #EAEAEA; 
            cursor: pointer; 
            font-size: 0.9rem; 
            transition: all 0.2s;
        }
        
        .opt-row:hover { 
            border-color: var(--gold); 
            background: #FCF9F5; 
        }
        
        .opt-row input { 
            margin-right: 12px; 
            accent-color: var(--oxford); 
            width: 17px; 
            height: 17px;
        }
        
        .opt-row.correct { 
            background: #D4EDDA !important; 
            border-color: #28A745 !important; 
            color: #155724; 
            font-weight: 600;
        }
        
        .opt-row.wrong { 
            background: #F8D7DA !important; 
            border-color: #DC3545 !important; 
            color: #721C24;
        }
        
        .action-btn { 
            background: var(--oxford); 
            color: white; 
            border: none; 
            padding: 15px 30px; 
            font-size: 0.9rem; 
            font-weight: 600; 
            border-radius: 8px; 
            cursor: pointer; 
            transition: background 0.3s; 
            width: 100%; 
            margin-top: 10px;
        }
        
        .action-btn:hover { 
            background: var(--dark-blue); 
        }
        
        .book-container { 
            width: 100%; 
            background: white; 
            border-radius: 12px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.03); 
            border: 1px solid #EAEAEA; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 400px; 
            justify-content: center;
        }
        
        .book-header { 
            width: 100%; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 15px; 
            border-bottom: 1px solid #F1F3F6; 
            padding-bottom: 10px;
        }
        
        .book-title { 
            font-size: 0.85rem; 
            font-weight: 700; 
            color: var(--gold); 
            text-transform: uppercase;
        }
        
        .book-page-label { 
            font-size: 0.85rem; 
            font-weight: 600; 
            color: #777; 
            background: #F1F3F6; 
            padding: 4px 10px; 
            border-radius: 4px;
        }
        
        .canvas-wrapper { 
            width: 100%; 
            overflow-x: auto; 
            display: flex; 
            justify-content: center; 
            background: #525659; 
            padding: 15px; 
            border-radius: 8px;
        }
        
        canvas { 
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); 
            background: white;
        }
        
        .carnet-card { 
            background: #FFF; 
            border-radius: 10px; 
            padding: 15px; 
            border: 1px solid #EAEAEA; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }
        
        .carnet-meta { 
            font-size: 0.75rem; 
            color: var(--gold); 
            font-weight: 700; 
            margin-bottom: 5px;
        }
        
        .carnet-title { 
            font-size: 0.9rem; 
            font-weight: 600; 
            color: var(--oxford); 
            margin-bottom: 8px;
        }
        
        .carnet-score { 
            font-size: 0.8rem; 
            font-weight: 600; 
            color: #555;
        }
        
        .empty-state { 
            text-align: center; 
            color: #999; 
            padding: 40px 20px; 
            font-size: 0.85rem; 
            font-style: italic;
        }
    </style>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
</head>
<body>

    <div class="sidebar">
        <div class="logo-area">
            <h2>Espace DELF</h2>
            <span id="display-nivel">Chargement...</span>
        </div>
        <div class="main-tabs">
            <button id="tab-parcours" class="tab-trigger active">Parcours</button>
            <button id="tab-carnet" class="tab-trigger">Carnet</button>
        </div>
        <div class="menu-scroll" id="menu-container"></div>
    </div>

    <div class="app-body">
        <div class="top-navbar">
            <div class="skills-selector">
                <button id="skill-CO" class="skill-pill active"><i class="fas fa-headphones"></i> Oral</button>
                <button id="skill-CE" class="skill-pill"><i class="fas fa-file-alt"></i> Écrit</button>
                <button id="skill-PE" class="skill-pill"><i class="fas fa-pen"></i> PE</button>
                <button id="skill-PO" class="skill-pill"><i class="fas fa-comments"></i> PO</button>
            </div>
            <div style="font-size:0.85rem; font-weight:600; color:#555;">
                <i class="fas fa-user-circle" style="margin-right:5px; color:var(--gold);"></i> Étudiant
            </div>
        </div>

        <div class="content-workspace" id="view-parcours">
            <div class="panel-left" id="workspace-target"></div>
            <div class="panel-right">
                <div class="right-header"><i class="fas fa-book-open" style="margin-right:8px; color:var(--gold);"></i> Livre de l'élève</div>
                <div class="right-scroll" id="book-target"></div>
            </div>
        </div>

        <div class="content-workspace" id="view-carnet" style="display:none;">
            <div style="flex:1; padding:40px; overflow-y:auto;">
                <div class="workspace-card" style="max-width:900px; margin:0 auto;">
                    <h3><i class="fas fa-graduation-cap" style="margin-right:10px; color:var(--gold);"></i> Mon Historique de Réussite</h3>
                    <div id="carnet-grid" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(250px, 1fr)); gap:20px;"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // CONFIGURACIÓN DE TU PROYECTO FIREBASE
        // RECUERDA PEGAR AQUÍ TUS CREDENCIALES REALES
        const firebaseConfig = {
            apiKey: "AIzaSyD...", 
            authDomain: "tu-proyecto.firebaseapp.com",
            projectId: "tu-proyecto-id",
            storageBucket: "tu-proyecto.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:12345:web:abcd"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let currentNivel = "A1";
        let currentMainTab = "parcours";
        let currentSkill = "CO";
        let unidadesCache = {};
        let openUnits = {};

        let activeUnitId = null;
        let activeActIndex = null;

        let pdfDocInstance = null;
        const RUTA_BOOK_PDF = "book.pdf";

        function init() {
            document.getElementById('display-nivel').innerText = `Niveau ${currentNivel}`;
            loadLibraryFromFirebase();
            loadPdfEngine();
        }

        function loadLibraryFromFirebase() {
            db.collection("BibliotecaEjercicios").document(currentNivel).collection("Unidades").get()
            .then(snap => {
                unidadesCache = {};
                snap.forEach(doc => { unidadesCache[doc.id] = doc.data(); });
                renderLeftMenu();
            }).catch(err => console.error("Erreur Firebase:", err));
        }

        function loadPdfEngine() {
            if (typeof pdfjsLib !== 'undefined') {
                pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
                pdfjsLib.getDocument(RUTA_BOOK_PDF).promise.then(pdf => {
                    pdfDocInstance = pdf;
                    console.log("PDF principal cargado con éxito.");
                }).catch(err => {
                    console.warn("Falta el archivo book.pdf, el renderizador visual de páginas estará inactivo:", err.message);
                });
            }
        }

        window.switchMainTab = function(tab) {
            currentMainTab = tab;
            document.getElementById('tab-parcours').classList.toggle('active', tab === 'parcours');
            document.getElementById('tab-carnet').classList.toggle('active', tab === 'carnet');
            document.getElementById('view-parcours').style.display = tab === 'parcours' ? 'flex' : 'none';
            document.getElementById('view-carnet').style.display = tab === 'carnet' ? 'flex' : 'none';
            if (tab === 'carnet') renderCarnetDashboard();
        };

        window.setSkillFilter = function(skill) {
            currentSkill = skill;
            document.querySelectorAll('.skill-pill').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`skill-${skill}`).classList.add('active');
            
            // CORRECCIÓN 1: Limpia el espacio de trabajo central al cambiar de habilidad
            activeUnitId = null;
            activeActIndex = null;
            document.getElementById('workspace-target').innerHTML = "";
            document.getElementById('book-target').innerHTML = `<div class="empty-state">Visuel du livre non requis ou non lié pour cet exercice.</div>`;
            
            renderLeftMenu();
        };

        window.toggleUnitFold = function(uId) {
            openUnits[uId] = !openUnits[uId];
            renderLeftMenu();
        };

        function renderLeftMenu() {
            const container = document.getElementById('menu-container');
            container.innerHTML = "";
            const keys = Object.keys(unidadesCache).sort((a,b) => a.localeCompare(b, undefined, {numeric:true}));

            keys.forEach(uId => {
                const u = unidadesCache[uId];
                const ejercicios = u[currentSkill] || [];
                if (ejercicios.length === 0) return; 

                const isOpen = openUnits[uId] === true;
                let bloc = document.createElement('div');
                bloc.className = "unit-bloc";
                bloc.innerHTML = `
                    <button class="unit-header ${activeUnitId === uId ? 'active-unit' : ''}" onclick="window.toggleUnitFold('${uId}')">
                        <span><i class="fas fa-folder" style="margin-right:8px; color:var(--gold);"></i>${u.unidad || uId}</span>
                        <i class="fas ${isOpen ? 'fa-chevron-down' : 'fa-chevron-right'}" style="font-size:0.7rem; color:var(--gold);"></i>
                    </button>
                `;

                if (isOpen) {
                    let list = document.createElement('div');
                    list.className = "act-list";
                    ejercicios.forEach((ej, index) => {
                        let actTitle = ej.instruccion ? (ej.instruccion.match(/Activité\s*\d+/i)?.[0] || `Activité ${index+1}`) : `Activité ${index+1}`;
                        const isSelected = (activeUnitId === uId && activeActIndex === index);
                        list.innerHTML += `
                            <button class="act-item ${isSelected ? 'active-act' : ''}" onclick="window.displayWorkspace('${uId}', ${index})">
                                <i class="fas fa-file-signature" style="font-size:0.75rem;"></i> ${actTitle}
                            </button>
                        `;
                    });
                    bloc.appendChild(list);
                }
                container.appendChild(bloc);
            });

            if (container.children.length === 0) {
                container.innerHTML = `<div class="empty-state">Aucun exercice disponible.</div>`;
            }
        }

        window.displayWorkspace = function(uId, index) {
            activeUnitId = uId;
            activeActIndex = index;
            renderLeftMenu();

            const workspace = document.getElementById('workspace-target');
            const bookTarget = document.getElementById('book-target');
            const ej = unidadesCache[uId][currentSkill][index];

            let html = `<div class="workspace-card"><h3>${ej.instruccion || 'Exercice'}</h3>`;
            const audioId = `audio-player-${uId}-${index}`;

            if (ej.ruta_audio) {
                html += `<div id="${audioId}" style="margin-bottom: 20px; text-align:center;"><i class="fas fa-spinner fa-spin"></i> Audio...</div>`;
            }

            // CORRECCIÓN 2: Se encarga de mostrar la lectura generada por la IA o cargada en Firebase para la sección de CE
            if (currentSkill === "CE" && ej.texto_lectura) {
                html += `<div style="background:#f8f9fa; border-left:4px solid var(--gold); padding:20px; border-radius:6px; margin-bottom:20px; font-size:0.95rem; line-height:1.6; color:#333; white-space:pre-wrap;"><strong><i class="fas fa-file-text" style="color:var(--gold); margin-right:8px;"></i> Document de lecture :</strong><br><br>${ej.texto_lectura}</div>`;
            }

            if (ej.preguntas && ej.preguntas.length > 0) {
                ej.preguntas.forEach((q, qIdx) => {
                    let opts = "";
                    q.opciones.forEach(opc => {
                        opts += `
                            <label class="opt-row row-q-${qIdx}">
                                <input type="radio" name="input-q-${qIdx}" value="${opc}">
                                <span>${opc}</span>
                            </label>
                        `;
                    });
                    html += `
                        <div class="q-wrapper" id="block-q-${qIdx}">
                            <div class="q-text">${qIdx + 1}. ${q.pregunta}</div>
                            <div class="opts-list">${opts}</div>
                        </div>
                    `;
                });
                html += `<button class="action-btn" onclick="window.checkAnswers()">Valider mes réponses</button>`;
            } else {
                html += `<p style="font-style:italic; color:#777;">Production libre ou exercice écrit. Répondez sur votre cahier.</p>`;
            }
            html += `</div>`;
            workspace.innerHTML = html;

            if (ej.ruta_audio) {
                db.collection("BibliotecaEjercicios").document(currentNivel).get().then(doc => {
                    const audiosMap = doc.data()?.audios || {};
                    const url = audiosMap[ej.ruta_audio];
                    const playerBox = document.getElementById(audioId);
                    if (url) {
                        playerBox.innerHTML = `<audio controls src="${url}" style="width:100%;"></audio>`;
                    } else {
                        playerBox.innerHTML = `<span style="font-size:0.8rem; color:#d9534f;"><i class="fas fa-exclamation-triangle"></i> Audio non lié (${ej.ruta_audio})</span>`;
                    }
                });
            }

            if (ej.pagina_pdf) {
                bookTarget.innerHTML = `
                    <div class="book-container">
                        <div class="book-header">
                            <span class="book-title">Livre d'exercices</span>
                            <span class="book-page-label">Page ${ej.pagina_pdf}</span>
                        </div>
                        <div class="canvas-wrapper"><canvas id="pdf-canvas-render"></canvas></div>
                    </div>
                `;
                renderPageFromBook(parseInt(ej.pagina_pdf));
            } else {
                bookTarget.innerHTML = `<div class="empty-state">Visuel du livre non requis ou non lié pour cet exercice.</div>`;
            }
        };

        window.checkAnswers = function() {
            const ej = unidadesCache[activeUnitId][currentSkill][activeActIndex];
            let score = 0;
            let total = ej.preguntas.length;

            ej.preguntas.forEach((q, qIdx) => {
                const checked = document.querySelector(`input[name="input-q-${qIdx}"]:checked`);
                const rows = document.querySelectorAll(`.row-q-${qIdx}`);

                rows.forEach(row => {
                    row.classList.remove('correct', 'wrong');
                    const val = row.querySelector('input').value;
                    if (val === q.respuesta_correcta) row.classList.add('correct');
                    if (checked && row.querySelector('input') === checked && checked.value !== q.respuesta_correcta) {
                        row.classList.add('wrong');
                    }
                });

                if (checked && checked.value === q.respuesta_correcta) score++;
            });

            let actTitle = ej.instruccion ? (ej.instruccion.match(/Activité\s*\d+/i)?.[0] || `Activité ${activeActIndex+1}`) : `Activité ${activeActIndex+1}`;
            const keyRecord = `${currentNivel}_${activeUnitId}_${currentSkill}_${activeActIndex}`;
            localStorage.setItem(keyRecord, JSON.stringify({
                nivel: currentNivel,
                unidad: activeUnitId,
                skill: currentSkill,
                act: actTitle,
                score: `${score}/${total}`,
                date: new Date().toLocaleDateString('fr-FR')
            }));
            
            alert(`Resultat: ${score} / ${total}`);
        };

        function renderCarnetDashboard() {
            const grid = document.getElementById('carnet-grid');
            grid.innerHTML = "";
            let count = 0;

            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (!key.startsWith(currentNivel + "_")) continue;
                
                try {
                    const data = JSON.parse(localStorage.getItem(key));
                    count++;
                    grid.innerHTML += `
                        <div class="carnet-card">
                            <div class="carnet-meta">${data.date} | ${data.skill}</div>
                            <div class="carnet-title">${data.unidad} - ${data.act}</div>
                            <div class="carnet-score"><i class="fas fa-star" style="color:var(--gold); margin-right:5px;"></i> Score : ${data.score}</div>
                        </div>
                    `;
                } catch(e) {}
            }

            if (count === 0) {
                grid.innerHTML = `<div class="empty-state" style="grid-column: 1/-1;">Aucun historique trouvé para le niveau ${currentNivel}.</div>`;
            }
        }

        function renderPageFromBook(pageNum) {
            if (!pdfDocInstance) {
                setTimeout(() => renderPageFromBook(pageNum), 1000);
                return;
            }
            pdfDocInstance.getPage(pageNum).then(page => {
                const canvas = document.getElementById('pdf-canvas-render');
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                const viewport = page.getViewport({ scale: 1.5 });
                canvas.height = viewport.height;
                canvas.width = viewport.width;
                page.render({ canvasContext: ctx, viewport: viewport });
            }).catch(err => console.error("Erreur de rendu PDF:", err));
        }

        document.getElementById('skill-PE').addEventListener('click', () => window.setSkillFilter('PE'));
        document.getElementById('skill-PO').addEventListener('click', () => window.setSkillFilter('PO'));

        init();
    </script>
