<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Espace DELF | Réussite</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --oxford: #002147; --gold: #C5A059; --cream: #F8F9FA; --white: #FFFFFF; --green: #28A745; }
        body { font-family: 'Montserrat', sans-serif; background-color: var(--cream); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* SIDEBAR */
        .sidebar { width: 280px; background: var(--oxford); color: white; padding: 30px 20px; display: flex; flex-direction: column; }
        .sidebar h2 { color: var(--gold); font-size: 1.1rem; border-bottom: 1px solid var(--gold); padding-bottom: 20px; text-align: center; }
        .skill-btn { background: transparent; border: 1px solid rgba(197, 160, 89, 0.2); color: white; padding: 15px; margin-bottom: 10px; border-radius: 10px; cursor: pointer; text-align: left; display: flex; align-items: center; transition: 0.3s; }
        .skill-btn.active, .skill-btn:hover { background: var(--gold); color: var(--oxford); font-weight: 700; }

        /* DASHBOARD HEADER */
        .header-dashboard { background: var(--white); padding: 20px 40px; border-bottom: 1px solid #ddd; display: grid; grid-template-columns: 1fr 2fr 1fr; align-items: center; gap: 30px; }
        
        .student-info h3 { margin: 0; color: var(--oxford); font-size: 1.2rem; }
        .student-info span { color: var(--gold); font-weight: 700; font-size: 0.9rem; }

        /* BARRA DE PROGRESO */
        .progress-container { background: #eee; border-radius: 20px; height: 15px; position: relative; overflow: hidden; }
        .progress-bar { background: var(--green); height: 100%; width: 0%; transition: 1s ease-in-out; }
        .progress-text { font-size: 0.75rem; font-weight: 700; color: var(--oxford); display: block; margin-bottom: 5px; }

        /* FECHA DE CERTIFICACIÓN */
        .cert-date { background: #fffdf0; border: 1px solid var(--gold); padding: 10px; border-radius: 10px; text-align: center; }
        .cert-date small { font-size: 0.6rem; text-transform: uppercase; color: #888; display: block; }
        .cert-date strong { color: var(--oxford); font-size: 0.9rem; }

        /* WORKSPACE */
        .workspace { flex: 1; padding: 40px; overflow-y: auto; display: flex; flex-direction: column; align-items: center; }
        .interaction-card { background: white; width: 100%; max-width: 900px; padding: 40px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.03); }

        .btn-admin { position: absolute; bottom: 20px; right: 20px; background: var(--oxford); color: white; padding: 10px; border-radius: 5px; text-decoration: none; font-size: 0.7rem; font-weight: bold; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <h2>OBJECTIF RÉUSSITE</h2>
        <button class="skill-btn" onclick="loadEx('CO')"><i class="fas fa-headset"></i> Comprensión Oral</button>
        <button class="skill-btn" onclick="loadEx('CE')"><i class="fas fa-book-open"></i> Comprensión Escrita</button>
        <button class="skill-btn" onclick="loadEx('PE')"><i class="fas fa-pen-nib"></i> Producción Escrita</button>
        <button class="skill-btn" onclick="loadEx('PO')"><i class="fas fa-microphone"></i> Producción Oral</button>
        <button class="skill-btn active" onclick="loadEx('LECTURE')"><i class="fas fa-language"></i> Phonétique</button>
    </aside>

    <main style="flex:1; display:flex; flex-direction:column;">
        <header class="header-dashboard">
            <div class="student-info">
                <h3>Bonjour, <span id="st-name">Chargement...</span></h3>
                <span id="st-level">Niveau B1</span>
            </div>

            <div class="progress-section">
                <span class="progress-text">AVANCE DE NIVEL: <span id="prog-val">0%</span></span>
                <div class="progress-container">
                    <div id="prog-bar" class="progress-bar"></div>
                </div>
            </div>

            <div class="cert-date">
                <small>Examen de Certification</small>
                <strong id="st-cert-date">-- / -- / ----</strong>
                <div id="days-left" style="font-size: 0.7rem; color: var(--green); font-weight: bold; margin-top: 5px;"></div>
            </div>
        </header>

        <section class="workspace">
            <div class="interaction-card">
                <h2 id="skill-title">Bienvenue dans ton parcours</h2>
                <div id="content-area">Selecciona una habilidad para comenzar tu entrenamiento.</div>
            </div>
        </section>

        <a href="admin.html" id="admin-back" class="btn-admin" style="display:none;">REGRESAR A PANEL ADMIN</a>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
        import { getFirestore, doc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCgog8tKspHy01ZHE8Dthl9O4W6lw1a_Ec",
            authDomain: "objectif-reussite-delf.firebaseapp.com",
            projectId: "objectif-reussite-delf",
            storageBucket: "objectif-reussite-delf.firebasestorage.app",
            messagingSenderId: "942279633770",
            appId: "1:942279633770:web:687ba6d819747eb29c1313"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function loadProfile() {
            const params = new URLSearchParams(window.location.search);
            const stId = params.get('id') || 'sergio'; // Sergio por defecto para pruebas
            if(params.get('access') === 'admin') document.getElementById('admin-back').style.display = 'block';

            // Escuchar cambios en tiempo real del perfil del alumno
            onSnapshot(doc(db, "Usuarios", stId), (snap) => {
                if (snap.exists()) {
                    const data = snap.data();
                    document.getElementById('st-name').innerText = data.nombre;
                    document.getElementById('st-level').innerText = "Niveau " + data.nivel;
                    document.getElementById('st-cert-date').innerText = data.fecha_certificacion;
                    
                    // Calcular días restantes
                    const hoy = new Date();
                    const fechaCert = new Date(data.fecha_certificacion);
                    const diff = Math.ceil((fechaCert - hoy) / (1000 * 60 * 60 * 24));
                    document.getElementById('days-left').innerText = `¡Faltan ${diff} días!`;

                    // Actualizar barra de progreso
                    const progreso = data.progreso || 0;
                    document.getElementById('prog-val').innerText = progreso + "%";
                    document.getElementById('prog-bar').style.width = progreso + "%";
                }
            });
        }

        window.loadEx = async (skill) => {
            // Aquí Sophia jala el contenido según el nivel del alumno cargado arriba
            document.getElementById('skill-title').innerText = "Entraînement : " + skill;
            document.getElementById('content-area').innerHTML = "<i class='fas fa-spinner fa-spin'></i> Sophia prepara el material...";
        };

        loadProfile();
    </script>
</body>
</html>
