<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mon Espace DELF | Réussite</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --oxford: #002147; 
            --gold: #C5A059; 
            --cream: #F8F9FA; 
            --green: #28A745; 
            --dark-blue: #001530;
        }
        
        body { 
            font-family: 'Montserrat', sans-serif; \n            margin: 0; 
            display: flex; 
            height: 100vh; 
            background: var(--cream); 
            overflow: hidden; 
        }
        
        .sidebar { 
            width: 290px; 
            background: var(--oxford); 
            color: white; 
            padding: 30px 15px; 
            flex-shrink: 0; 
            display: flex;
            flex-direction: column;
            box-shadow: 4px 0 10px rgba(0,0,0,0.1);
        }
        
        .sidebar h2 { 
            text-align: center; 
            font-size: 1.35rem; 
            margin-bottom: 35px; 
            font-weight: 700;
            letter-spacing: 1px;
            border-bottom: 2px solid var(--gold);
            padding-bottom: 15px;
        }
        
        .sidebar h3 { 
            font-size: 0.8rem; 
            text-transform: uppercase; 
            color: var(--gold); 
            margin: 20px 0 10px 10px; 
            letter-spacing: 1.5px;
            font-weight: 700;
        }
        
        .nav-btn { 
            width: 100%; 
            background: transparent; 
            border: none; 
            color: #b0c4de; 
            padding: 14px 15px; 
            text-align: left; 
            cursor: pointer; 
            font-size: 0.95rem; 
            border-radius: 8px; 
            margin-bottom: 6px; 
            display: flex; 
            align-items: center; 
            gap: 12px;
            font-weight: 400;
            transition: all 0.3s ease;
        }
        
        .nav-btn:hover, .nav-btn.active { 
            background: var(--gold); 
            color: white; 
            font-weight: 600;
            transform: translateX(4px);
        }
        
        .main-content { 
            flex-grow: 1; 
            padding: 35px; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
        }
        
        .top-bar { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 30px; 
            background: white; 
            padding: 18px 25px; 
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }
        
        .top-bar h1 { 
            margin: 0; 
            font-size: 1.5rem; 
            color: var(--oxford); 
            font-weight: 700;
        }
        
        .selector-container { 
            display: flex; 
            gap: 12px; 
        }
        
        select { 
            padding: 10px 18px; 
            border: 1px solid #dcdcdc; 
            border-radius: 8px; 
            font-size: 0.9rem; 
            background: white; 
            color: #333;
            font-weight: 600;
            cursor: pointer;
            transition: border-color 0.3s;
        }
        
        select:focus { 
            border-color: var(--gold); 
            outline: none; 
        }
        
        .workspace { 
            display: flex; 
            gap: 25px; 
            flex-grow: 1; 
            min-height: 0; 
        }
        
        .menu-panel { 
            width: 320px; 
            background: white; 
            border-radius: 12px; 
            padding: 20px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            overflow-y: auto; 
            flex-shrink: 0; 
        }
        
        .menu-panel h3 { 
            margin-top: 0; 
            margin-bottom: 20px; 
            color: var(--oxford); 
            font-size: 1.1rem; 
            font-weight: 700;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }
        
        .menu-item { 
            padding: 12px 15px; 
            border-radius: 8px; 
            cursor: pointer; 
            margin-bottom: 8px; 
            font-size: 0.9rem; 
            background: #f8fafc; 
            border-left: 4px solid transparent;
            font-weight: 600;
            color: #4a5568;
            transition: all 0.2s ease;
        }
        
        .menu-item:hover { 
            background: #edf2f7; 
            color: var(--oxford);
        }
        
        .menu-item.active { 
            background: #e1e7ec; 
            color: var(--oxford); 
            border-left-color: var(--gold); 
        }
        
        .content-panel { 
            flex-grow: 1; 
            background: white; 
            border-radius: 12px; 
            padding: 30px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            overflow-y: auto; 
        }
        
        .exercise-card { 
            background: white; 
        }
        
        .nav-tab-btn { 
            background: var(--gold); 
            color: white; 
            border: none; 
            padding: 12px 25px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: 600; 
            font-size: 0.95rem;
            transition: background 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .nav-tab-btn:hover { 
            background: #b38f4b; 
        }
        
        .user-profile { 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            font-weight: 600; 
            color: var(--oxford);
            font-size: 0.95rem;
        }
        
        .user-profile i { 
            font-size: 1.3rem; 
            color: var(--gold); 
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>MON ESPACE DELF</h2>
        
        <h3>Menu</h3>
        <button class="nav-btn active" id="tab-parcours">
            <i class="fas fa-route"></i> Mon Parcours
        </button>
        <button class="nav-btn" id="tab-carnet">
            <i class="fas fa-book"></i> Carnet de réussite
        </button>
        
        <h3>Compétences</h3>
        <button class="nav-btn" id="skill-CO"><i class="fas fa-headphones"></i> Écouter (CO)</button>
        <button class="nav-btn" id="skill-CE"><i class="fas fa-book-open"></i> Lire (CE)</button>
        <button class="nav-btn" id="skill-PE"><i class="fas fa-pen-nib"></i> Écrire (PE)</button>
        <button class="nav-btn" id="skill-PO"><i class="fas fa-comments"></i> Parler (PO)</button>
    </div>

    <div class="main-content">
        
        <div class="top-bar">
            <h1 id="main-view-title">Tableau de bord</h1>
            
            <div style="display: flex; gap: 25px; align-items: center;">
                <div class="selector-container" id="top-selectors">
                    <select id="select-level">
                        <option value="A1">Niveau A1</option>
                        <option value="A2">Niveau A2</option>
                        <option value="B1">Niveau B1</option>
                        <option value="B2" selected>Niveau B2</option>
                        <option value="C1">Niveau C1</option>
                    </select>

                    <select id="select-unite">
                        </select>
                </div>
                
                <div class="user-profile">
                    <i class="fas fa-user-circle"></i>
                    <span>Étudiant</span>
                </div>
            </div>
        </div>

        <div class="workspace" id="main-workspace-area">
            <div class="menu-panel">
                <h3 id="menu-panel-title">Activités</h3>
                <div id="dynamic-menu-target"></div>
            </div>

            <div class="content-panel" id="dynamic-workspace-target">
                <p style="text-align: center; color: #888; margin-top: 50px;">Sélectionnez una actividad dans le menu de gauche pour commencer.</p>
            </div>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, collection, getDocs, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getStorage, ref, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAjY1aPDRvNfOxf9r7gKJLGjRnYSWunqu8",
            authDomain: "delfpro-8982a.firebaseapp.com",
            projectId: "delfpro-8982a",
            storageBucket: "delfpro-8982a.appspot.com",
            messagingSenderId: "515918731362",
            appId: "1:515918731362:web:0cf02c7bb11db4db45300f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        // Variables de Control de Estado Global
        let currentTab = 'parcours'; 
        let currentLevel = 'B2';
        let currentUniteId = 'Unite_1'; 
        let currentSkill = 'CO'; 
        let currentExerciseIndex = 0; 

        let datosUnidadActual = null; 
        let ejerciciosFiltrados = []; 

        // Inicialización de la Aplicación al Cargar
        async function init() {
            configurarManejadoresDeEventos();
            await cargarListaDeUnidades();
            await descargarDatosDeUnidad();
        }

        function configurarManejadoresDeEventos() {
            document.getElementById('select-level').addEventListener('change', async (e) => {
                currentLevel = e.target.value;
                await cargarListaDeUnidades();
                await descargarDatosDeUnidad();
            });

            document.getElementById('select-unite').addEventListener('change', async (e) => {
                currentUniteId = e.target.value;
                await descargarDatosDeUnidad();
            });
        }

        window.switchMainTab = function(tabName) {
            currentTab = tabName;
            document.getElementById('tab-parcours').classList.toggle('active', tabName === 'parcours');
            document.getElementById('tab-carnet').classList.toggle('active', tabName === 'carnet');

            if (tabName === 'carnet') {
                document.getElementById('main-view-title').innerText = "Carnet de Réussite";
                document.getElementById('top-selectors').style.display = 'none';
                renderCarnetDeReussite();
            } else {
                document.getElementById('main-view-title').innerText = "Mon Parcours d'Apprentissage";
                document.getElementById('top-selectors').style.display = 'flex';
                generarMenuJerarquico();
                renderExerciseStructure();
            }
        }

        window.setSkillFilter = function(skillCode) {
            window.switchMainTab('parcours');
            currentSkill = skillCode;

            const skills = ['CO', 'CE', 'PE', 'PO'];
            skills.forEach(s => {
                document.getElementById(`skill-${s}`).classList.toggle('active', s === skillCode);
            });

            currentExerciseIndex = 0;
            generarMenuJerarquico();
            renderExerciseStructure();
        }

        async function cargarListaDeUnidades() {
            const selectUnite = document.getElementById('select-unite');
            selectUnite.innerHTML = '<option>Chargement des unités...</option>';

            try {
                const colRef = collection(db, "BibliotecaEjercicios", currentLevel, "Unidades");
                const snapshot = await getDocs(colRef);
                
                selectUnite.innerHTML = '';
                
                if (snapshot.empty) {
                    selectUnite.innerHTML = '<option value="">Aucune unité</option>';
                    return;
                }

                let unidades = [];
                snapshot.forEach(doc => {
                    unidades.push({ id: doc.id, ...doc.data() });
                });

                unidades.sort((a, b) => a.id.localeCompare(b.id, undefined, {numeric: true}));

                unidades.forEach((u, index) => {
                    const opt = document.createElement('option');
                    opt.value = u.id;
                    opt.innerText = u.unidad ? `${u.unidad} : ${u.tema || ''}` : u.id;
                    if (index === 0 && !currentUniteId) {
                        currentUniteId = u.id;
                    }
                    selectUnite.appendChild(opt);
                });

                if (unidades.length > 0) {
                    selectUnite.value = currentUniteId || unidades[0].id;
                    currentUniteId = selectUnite.value;
                }

            } catch (err) {
                console.error("Erreur lors de la récupération de la liste des unités :", err);
                selectUnite.innerHTML = '<option value="">Erreur de chargement</option>';
            }
        }

        async function descargarDatosDeUnidad() {
            if (!currentUniteId) return;
            
            const target = document.getElementById('dynamic-workspace-target');
            const menuTarget = document.getElementById('dynamic-menu-target');
            
            target.innerHTML = `<p style="text-align:center; color:#666; margin-top:50px;"><i class="fas fa-spinner fa-spin"></i> Téléchargement des données depuis Firestore...</p>`;
            menuTarget.innerHTML = `<p style="color:#888; font-size:0.85rem;">Chargement...</p>`;

            try {
                const docRef = doc(db, "BibliotecaEjercicios", currentLevel, "Unidades", currentUniteId);
                const snapshot = await getDoc(docRef);

                if (snapshot.exists()) {
                    datosUnidadActual = snapshot.data();
                    generarMenuJerarquico();
                    renderExerciseStructure();
                } else {
                    datosUnidadActual = null;
                    ejerciciosFiltrados = [];
                    target.innerHTML = `<p style="text-align:center; color:orange; margin-top:50px;">Cette unité ne contient aucun contenu.</p>`;
                    menuTarget.innerHTML = `<p style="color:#888; font-size:0.85rem;">Vide</p>`;
                }
            } catch (err) {
                console.error(err);
                target.innerHTML = `<p style="text-align:center; color:red; margin-top:50px;">Erreur réseau lors de la synchronisation.</p>`;
            }
        }

        function filtrarEjerciciosDeUnidadActual() {
            if (!datosUnidadActual || !datosUnidadActual[currentSkill]) {
                ejerciciosFiltrados = [];
                return;
            }
            ejerciciosFiltrados = datosUnidadActual[currentSkill];
        }

        function generarMenuJerarquico() {
            const menuTarget = document.getElementById('dynamic-menu-target');
            menuTarget.innerHTML = '';
            
            filtrarEjerciciosDeUnidadActual();
            document.getElementById('menu-panel-title').innerText = `Activités (${currentSkill})`;

            if (ejerciciosFiltrados.length === 0) {
                menuTarget.innerHTML = `<p style="color:#999; font-size:0.85rem; padding:10px;">Aucune activité disponible pour cette compétence.</p>`;
                return;
            }

            ejerciciosFiltrados.forEach((item, index) => {
                const btn = document.createElement('div');
                btn.className = `menu-item ${index === currentExerciseIndex ? 'active' : ''}`;
                
                let extractoInstruccion = item.instruccion || `Activité ${index + 1}`;
                if (extractoInstruccion.length > 32) {
                    extractoInstruccion = extractoInstruccion.substring(0, 30) + '...';
                }

                btn.innerHTML = `<i class="fas fa-tasks" style="margin-right:8px; font-size:0.8rem; color:var(--gold);"></i> ${extractoInstruccion}`;
                
                btn.addEventListener('click', () => {
                    currentExerciseIndex = index;
                    document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
                    btn.classList.add('active');
                    renderExerciseStructure();
                });

                menuTarget.appendChild(btn);
            });
        }

        // =====================================================================
        // RENDERIZADO DINÁMICO CORREGIDO PARA MOSTRAR IMÁGENES EN CUADRÍCULA
        // =====================================================================
        function renderExerciseStructure() {
            const target = document.getElementById('dynamic-workspace-target');
            filtrarEjerciciosDeUnidadActual();

            if (ejerciciosFiltrados.length === 0 || !ejerciciosFiltrados[currentExerciseIndex]) {
                target.innerHTML = `<p style="text-align:center; color:#888;">Aucun exercice disponible.</p>`;
                return;
            }

            const ej = ejerciciosFiltrados[currentExerciseIndex];
            const audioId = `audio-container-${currentExerciseIndex}`;

            let html = `
            <div class="exercise-card">
                <h4 style="margin-top: 0; margin-bottom: 20px; color: var(--oxford); font-size: 1.05rem; font-weight:700;">
                    ${ej.instruccion || 'Exercice'} 
                </h4>`;

            if (ej.ruta_audio) {
                html += `
                <div id="${audioId}" style="margin-bottom: 20px; background: #fafafa; padding: 12px; border-radius: 6px; border: 1px dashed var(--gold); text-align:center; color:#666; font-size:0.9rem;">
                    <i class="fas fa-spinner fa-spin"></i> Chargement du fichier audio...
                </div>`;
            }

            if (ej.preguntas && ej.preguntas.length > 0) {
                ej.preguntas.forEach((p, pIdx) => {
                    html += `
                    <div class="pregunta-block" id="block-preg-${pIdx}" style="padding:15px; border-radius:6px; margin-bottom:15px; border:1px solid #eef2f5; position:relative;">
                        <p style="margin-top:0; margin-bottom:12px; font-weight:600; color:#222; display:flex; align-items:center;">
                            <span id="status-icon-target-${pIdx}"></span>
                            <span>${p.pregunta}</span>
                        </p>`;
                    
                    // =====================================================================
                    // CAMBIO CLAVE: DISEÑO DE VISTA DE IMÁGENES EN COLUMNAS (GRID)
                    // =====================================================================
                    if (p.descripcion_imagenes && p.descripcion_imagenes.length > 0) {
                        html += `<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; margin-bottom: 15px;">`;
                        
                        p.descripcion_imagenes.forEach((desc, dIdx) => {
                            let busquedaLimpia = desc.replace(/^Image\s+[A-F]\s*:\s*/i, "");
                            let identificadorLetra = desc.match(/^Image\s+([A-F])/i) ? desc.match(/^Image\s+([A-F])/i)[0] : `Option ${dIdx + 1}`;
                            
                            let urlImagenAutomatica = `https://images.unsplash.com/photo-1546410531-bb4caa6b424d?q=80&w=400`; // Por defecto
                            if(busquedaLimpia) {
                                urlImagenAutomatica = `https://source.unsplash.com/featured/400x300/?${encodeURIComponent(busquedaLimpia)}`;
                            }

                            html += `
                            <div style="background: white; border: 1px solid #ddd; border-radius: 8px; padding: 10px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05);">
                                <img src="${urlImagenAutomatica}" alt="${identificadorLetra}" style="width: 100%; height: 140px; object-fit: cover; border-radius: 6px; margin-bottom: 8px; background: #eaeaea;">
                                <label style="display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; font-weight: 600; font-size: 0.9rem;">
                                    <input type="radio" name="question_${pIdx}" value="${identificadorLetra}" style="accent-color:var(--oxford);"> ${identificadorLetra}
                                </label>
                            </div>`;
                        });
                        
                        html += `</div>`;
                    } 
                    else if (p.opciones) {
                        p.opciones.forEach((opt) => {
                            html += `
                            <label style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px; cursor: pointer; font-size: 0.95rem;">
                                <input type="radio" name="question_${pIdx}" value="${opt}" style="accent-color:var(--oxford);"> ${opt}
                            </label>`;
                        });
                    }
                    
                    html += `</div>`;
                });

                html += `
                <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
                    <button class="nav-tab-btn" id="btn-submit-exercise" style="width:auto; margin:0; background:var(--oxford); color:white; padding:10px 22px; font-weight:600; font-size:0.9rem; border-radius:6px;"><i class="fas fa-paper-plane"></i> Envoyer</button>
                    <button class="nav-tab-btn" id="btn-next-exercise" style="width:auto; margin:0; background:var(--green); color:white; padding:10px 22px; font-weight:600; font-size:0.9rem; border-radius:6px; display:none;">Suivant <i class="fas fa-arrow-right"></i></button>
                </div>`;
            }

            html += `
                <div id="sophia-box" style="display:none; background:#f4f7f9; border-left:4px solid var(--gold); padding:20px; border-radius:6px; margin-top:25px;">
                    <div style="display:flex; align-items:center; gap:10px; font-weight:700; color:var(--oxford); margin-bottom:10px; font-size:0.95rem;">
                        <i class="fas fa-lightbulb" style="color:var(--gold);"></i> CONSEIL DE SOPHIA
                    </div>
                    <p id="sophia-verdict-text" style="margin:0; font-size:0.95rem; line-height:1.5;"></p>
                    ${ej.transcripcion ? `
                        <div style="font-weight:700; margin-top:15px; color:var(--oxford); font-size:0.9rem;"><i class="fas fa-file-audio"></i> Transcription :</div>
                        <div style="background:#fff; border:1px dashed #ccc; padding:12px; border-radius:5px; margin-top:8px; font-size:0.95rem; line-height:1.6; color:#333;">${ej.transcripcion}</div>
                    ` : ''}
                </div>
            </div>`;

            target.innerHTML = html;

            if (ej.ruta_audio) {
                const nombreArchivo = ej.ruta_audio.split('/').pop();
                let trackMatch = nombreArchivo.match(/\d+/);
                let track = trackMatch ? trackMatch[0] : "02";
                if (track === "1" || track === "01") track = "02";
                if (track.length > 2) track = track.slice(-2);
                if (track.length === 1) track = "0" + track;
                let nombreArchivoFinal = `${currentLevel}-${track}.mp3`;

                getDownloadURL(ref(storage, `niveles/${currentLevel}/audios/${nombreArchivoFinal}`))
                    .then(url => {
                        const container = document.getElementById(audioId);
                        if (container) container.innerHTML = `<audio controls style="width:100%;" src="${url}" preload="auto"></audio>`;
                    })
                    .catch(() => {
                        getDownloadURL(ref(storage, `niveles/${currentLevel}/audios/${track}.mp3`))
                            .then(url => {
                                const container = document.getElementById(audioId);
                                if (container) container.innerHTML = `<audio controls style="width:100%;" src="${url}" preload="auto"></audio>`;
                            })
                            .catch(() => {
                                const container = document.getElementById(audioId);
                                container.innerHTML = `<span style="color:red; font-size:0.85rem;"><i class="fas fa-exclamation-triangle"></i> Audio non disponible (${nombreArchivoFinal})</span>`;
                            });
                    });
            }

            const btnSubmit = document.getElementById('btn-submit-exercise');
            const btnNext = document.getElementById('btn-next-exercise');
            const sophiaBox = document.getElementById('sophia-box');

            if (btnSubmit) {
                btnSubmit.addEventListener('click', () => {
                    let total = ej.preguntas.length;
                    let aciertos = 0;

                    ej.preguntas.forEach((p, pIdx) => {
                        const selected = document.querySelector(`input[name="question_${pIdx}"]:checked`);
                        const iconTarget = document.getElementById(`status-icon-target-${pIdx}`);
                        const block = document.getElementById(`block-preg-${pIdx}`);
                        
                        let rAlumno = selected ? selected.value.trim().toLowerCase() : "";
                        let rCorrecta = p.respuesta_correcta.trim().toLowerCase();

                        if (rAlumno === rCorrecta) {
                            aciertos++;
                            iconTarget.innerHTML = `<i class="fas fa-check-circle" style="color:var(--green); margin-right:8px; font-size:1.1rem;"></i>`;
                            block.style.borderColor = "var(--green)";
                        } else {
                            iconTarget.innerHTML = `<i class="fas fa-times-circle" style="color:red; margin-right:8px; font-size:1.1rem;"></i>`;
                            block.style.borderColor = "red";
                        }
                    });

                    document.querySelectorAll('input[type="radio"]').forEach(r => r.disabled = true);
                    btnSubmit.style.display = "none";
                    if (btnNext) btnNext.style.display = "inline-block";

                    let porcentaje = (aciertos / total) * 100;
                    const txtSophia = document.getElementById('sophia-verdict-text');
                    if (porcentaje >= 70) {
                        txtSophia.innerHTML = `<strong>Félicitations !</strong> Tu as obtenu <strong>${aciertos}/${total}</strong>. Tu as très bien compris l'exercice, tu peux passer au suivante de manera sûre.`;
                        txtSophia.style.color = "var(--green)";
                    } else {
                        txtSophia.innerHTML = `<strong>Attention !</strong> Tu as obtenu <strong>${aciertos}/${total}</strong>. Je te conseille de réécouter l'audio, de lire la transcription ci-dessous et de repetir l'exercice.`;
                        txtSophia.style.color = "red";
                    }
                    if (sophiaBox) sophiaBox.style.display = "block";
                });
            }

            if (btnNext) {
                btnNext.addEventListener('click', () => {
                    currentExerciseIndex++;
                    generarMenuJerarquico();
                    renderExerciseStructure();
                });
            }
        }

        async function renderCarnetDeReussite() {
            const target = document.getElementById('dynamic-workspace-target');
            document.getElementById('dynamic-menu-target').innerHTML = `<p style="color:#888; font-size:0.85rem; padding:10px;">Référentiel CECRL actif pour le niveau ${currentLevel}.</p>`;
            
            target.innerHTML = `<p style="text-align:center; color:#666;"><i class="fas fa-spinner fa-spin"></i> Analyse de vos compétences...</p>`;

            try {
                const docRef = doc(db, "BibliotecaEjercicios", currentLevel, "Descriptores", "Lista");
                const snapshot = await getDoc(docRef);

                if (snapshot.exists()) {
                    const datos = snapshot.data();
                    const lista = datos.items || [];
                    
                    target.innerHTML = `
                    <div style="background:#fff; padding:5px;">
                        <h3 style="margin-top:0; color:var(--oxford); font-weight:700; margin-bottom:5px;">Mon passeport de compétences - ${currentLevel}</h3>
                        <p style="color:#666; font-size:0.9rem; margin-bottom:25px;">Voici la liste des savoir-faire requis par le Cadre européen (CECRL) que vous validez à travers vos exercices.</p>
                        <div id="lista-descriptores-container"></div>
                    </div>`;

                    const container = document.getElementById('lista-descriptores-container');
                    lista.forEach(item => {
                        container.innerHTML += `
                        <div style="display:flex; align-items:center; gap:15px; background:#f8fafc; padding:14px; border-radius:8px; margin-bottom:10px; border:1px solid #e2e8f0;">
                            <i class="fas fa-check-circle" style="color:var(--green); font-size: 1.3rem;"></i>
                            <div>
                                <span style="font-size:0.75rem; background:#eef2f5; color:var(--oxford); padding:3px 8px; border-radius:4px; font-weight:700; margin-right:10px;">${item.competencia || 'CECRL'}</span>
                                <span style="font-size:0.95rem; color:#333;">${item.descriptor}</span>
                            </div>
                        </div>`;
                    });
                } else {
                    target.innerHTML = `<p style="color:#888;">Aucun descripteur trouvé pour ce niveau.</p>`;
                }
            } catch (err) {
                console.error(err);
                target.innerHTML = `<p style="color:red;">Erreur lors du chargement.</p>`;
            }
        }

        document.getElementById('tab-parcours').addEventListener('click', () => window.switchMainTab('parcours'));
        document.getElementById('tab-carnet').addEventListener('click', () => window.switchMainTab('carnet'));
        document.getElementById('skill-CO').addEventListener('click', () => window.setSkillFilter('CO'));
        document.getElementById('skill-CE').addEventListener('click', () => window.setSkillFilter('CE'));
        document.getElementById('skill-PE').addEventListener('click', () => window.setSkillFilter('PE'));
        document.getElementById('skill-PO').addEventListener('click', () => window.setSkillFilter('PO'));

        init();
    </script>
</body>
</html>
