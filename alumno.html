<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mon Espace DELF | Réussite</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --oxford: #002147; --gold: #C5A059; --cream: #F8F9FA; --green: #28A745; }
        body { font-family: 'Montserrat', sans-serif; margin: 0; display: flex; height: 100vh; background: var(--cream); }
        .sidebar { width: 260px; background: var(--oxford); color: white; padding: 30px 20px; }
        .main { flex: 1; padding: 40px; overflow-y: auto; }
        .exercise-card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; border-left: 5px solid var(--gold); }
        .unit-box { margin-bottom: 40px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>Mon Espace</h2>
        <button onclick="window.location.reload()" style="background:var(--gold); border:none; padding:10px; width:100%; border-radius:5px; cursor:pointer;">Actualizar ejercicios</button>
    </div>
    
    <div class="main">
        <h1 id="student-welcome">Bonjour</h1>
        <div id="dynamic-workspace-target">
            <p>Chargement des exercices...</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyCgog8tKspHy01ZHE8Dthl9O4W6lw1a_Ec", 
            authDomain: "objectif-reussite-delf.firebaseapp.com", 
            projectId: "objectif-reussite-delf", 
            storageBucket: "objectif-reussite-delf.firebasestorage.app", 
            messagingSenderId: "942279633770", 
            appId: "1:942279633770:web:687ba6d819747eb29c1313" 
        };
        const app = initializeApp(firebaseConfig); 
        const db = getFirestore(app);

        async function init() {
            const target = document.getElementById('dynamic-workspace-target');
            try {
                // Traemos los datos del nivel A1
                const snap = await getDoc(doc(db, "BibliotecaEjercicios", "A1"));
                if (!snap.exists()) return target.innerHTML = "Aucun exercice trouvé.";
                
                const data = snap.data();
                // Aquí abrimos la "caja" Valor si existe, o usamos los datos directos
                const dbData = data.Valor ? JSON.parse(data.Valor) : data;
                
                render(dbData);
            } catch (e) {
                target.innerHTML = "Erreur: " + e.message;
            }
        }

        function render(data) {
            const target = document.getElementById('dynamic-workspace-target');
            target.innerHTML = "";
            
            // Recorremos el itinerario
            (data.itinerario || []).forEach(u => {
                let html = `<div class="unit-box"><h3>${u.unidad || 'Unité'} - ${u.tema || ''}</h3>`;
                
                // Extraemos los ejercicios de CO (ya sea en el formato de Python o en el de Admin)
                const ejercicios = u.CO || (u.ejercicios ? u.ejercicios.filter(e => e.habilidad === 'CO') : []);
                
                ejercicios.forEach(ej => {
                    html += `<div class="exercise-card"><h4>${ej.instruccion || 'Exercice'}</h4>`;
                    (ej.preguntas || []).forEach(p => {
                        html += `<p><strong>${p.pregunta}</strong></p>`;
                        (p.opciones || []).forEach(opt => {
                            html += `<label><input type="radio"> ${opt}</label><br>`;
                        });
                    });
                    html += `</div>`;
                });
                target.innerHTML += html + `</div>`;
            });
        }
        init();
    </script>
</body>
</html>
