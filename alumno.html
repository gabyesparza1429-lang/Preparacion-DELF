<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Vista Alumno | NeuroRéussit</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --oxford: #002147; --gold: #C5A059; --white: #ffffff; }
        body { font-family: 'Montserrat', sans-serif; margin: 0; background: #f4f7f9; }
        
        /* Barra de Moodle (Solo para Admin) */
        #admin-bar { 
            display: none; 
            background: var(--gold); 
            color: var(--oxford); 
            padding: 10px 20px; 
            text-align: center; 
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .btn-back { background: var(--oxford); color: white; border: none; padding: 5px 15px; border-radius: 5px; cursor: pointer; margin-left: 15px; }

        .container { padding: 40px; max-width: 900px; margin: auto; }
        .card-ejercicio { background: white; padding: 20px; border-radius: 10px; margin-bottom: 15px; border-left: 5px solid var(--gold); }
        
        /* Modal de Login (Alumno real) */
        #login-screen { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: var(--oxford); color: white; display: flex; 
            flex-direction: column; align-items: center; justify-content: center; z-index: 1000;
        }
    </style>
</head>
<body>

    <div id="admin-bar">
        <span>VISTA PREVIA: MODO ADMINISTRADOR</span>
        <button class="btn-back" onclick="window.location.href='admin.html'">Volver al Panel Admin</button>
    </div>

    <div id="login-screen">
        <h1>NeuroRéussit</h1>
        <p>Por favor, ingresa tu clave de alumno:</p>
        <input type="password" id="student-pass" style="padding: 10px; border-radius: 5px;">
        <br>
        <button class="btn-back" style="margin:0; background:var(--gold); color:var(--oxford)" onclick="checkLogin()">Entrar</button>
    </div>

    <div class="container" id="contenido-alumno" style="display:none;">
        <h1 id="titulo-nivel">Nivel: ...</h1>
        <div id="lista-ejercicios"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCgog8tKspHy01ZHE8Dthl9O4W6lw1a_Ec",
            authDomain: "objectif-reussite-delf.firebaseapp.com",
            projectId: "objectif-reussite-delf",
            storageBucket: "objectif-reussite-delf.firebasestorage.app",
            messagingSenderId: "942279633770",
            appId: "1:942279633770:web:687ba6d819747eb29c1313"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // LOGICA DE MODO PREVIEW (MOODLE)
        const urlParams = new URLSearchParams(window.location.search);
        const nivel = urlParams.get('nivel') || 'B1';
        const isPreview = urlParams.get('mode') === 'preview';

        if (isPreview) {
            document.getElementById('admin-bar').style.display = 'block';
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('contenido-alumno').style.display = 'block';
            cargarEjercicios(nivel);
        }

        function cargarEjercicios(nivelID) {
            document.getElementById('titulo-nivel').innerText = "Nivel: " + nivelID;
            onSnapshot(collection(db, "Niveles", nivelID, "Ejercicios"), (snap) => {
                const lista = document.getElementById('lista-ejercicios');
                lista.innerHTML = "";
                snap.forEach(doc => {
                    const d = doc.data();
                    lista.innerHTML += `
                        <div class="card-ejercicio">
                            <h3>${d.titulo}</h3>
                            <p>Tipo: ${d.tipo || 'DELF'}</p>
                            <button class="btn-back" style="background:var(--gold); color:var(--oxford)">Comenzar Actividad</button>
                        </div>`;
                });
            });
        }

        window.checkLogin = () => {
            const pass = document.getElementById('student-pass').value;
            if(pass === "1234") { // Aquí pones la clave real del alumno
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('contenido-alumno').style.display = 'block';
                cargarEjercicios(nivel);
            } else {
                alert("Clave incorrecta");
            }
        };
    </script>
</body>
</html>
