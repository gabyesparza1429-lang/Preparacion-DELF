<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mon Espace DELF | Réussite</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* TUS ESTILOS ORIGINALES SE MANTIENEN AQUÍ */
        :root { --oxford: #002147; --gold: #C5A059; --cream: #F8F9FA; --green: #28A745; }
        body { font-family: 'Montserrat', sans-serif; margin: 0; display: flex; height: 100vh; background: var(--cream); }
        .sidebar { width: 260px; background: var(--oxford); color: white; padding: 30px 20px; }
        .main { flex: 1; padding: 40px; overflow-y: auto; }
        /* TUS CLASES DE TARJETAS */
        .exercise-card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-left: 5px solid var(--gold); }
        .btn-action { background: var(--oxford); color: white; border: none; padding: 12px 25px; border-radius: 6px; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>Mon Espace</h2>
        <div id="progress-container">Progreso: <span id="progress-val">0%</span></div>
    </div>
    
    <div class="main">
        <div id="dynamic-workspace-target">
            </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js";

        // ... [TU CONFIG DE FIREBASE] ...
        
        let listaEjercicios = [];
        let indiceActual = 0;

        async function init() {
            const snap = await getDoc(doc(db, "BibliotecaEjercicios", "A1"));
            const data = snap.data().Valor ? JSON.parse(snap.data().Valor) : snap.data();
            
            // Aplanamos la lista manteniendo tu estructura
            data.itinerario.forEach(u => {
                const ejercicios = u.CO || u.ejercicios || [];
                listaEjercicios.push(...ejercicios);
            });
            renderizarEjercicio();
        }

        function renderizarEjercicio() {
            const target = document.getElementById('dynamic-workspace-target');
            if (indiceActual >= listaEjercicios.length) {
                target.innerHTML = "<h3>Exercice terminé !</h3>";
                return;
            }

            const ej = listaEjercicios[indiceActual];
            const progreso = ((indiceActual) / listaEjercicios.length) * 100;
            document.getElementById('progress-val').innerText = `${Math.round(progreso)}%`;

            target.innerHTML = `
                <div class="exercise-card">
                    <h4>${ej.instruccion || 'Exercice'}</h4>
                    ${ej.ruta_audio ? `<audio controls src="${ej.ruta_audio}"></audio>` : ""}
                    <div id="preguntas-container"></div>
                    <button class="btn-action" onclick="validar()">Valider la réponse</button>
                </div>
            `;

            // Lógica de preguntas
            const pCont = document.getElementById('preguntas-container');
            (ej.preguntas || []).forEach(p => {
                pCont.innerHTML += `<p>${p.pregunta}</p>`;
                p.opciones.forEach(opt => {
                    pCont.innerHTML += `<label><input type="radio" name="res"> ${opt}</label><br>`;
                });
            });
        }

        window.validar = () => {
            alert("Réponse envoyée");
            indiceActual++;
            renderizarEjercicio();
        };

        init();
    </script>
</body>
</html>
