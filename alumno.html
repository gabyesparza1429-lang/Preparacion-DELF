<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace Étudiant | Réussite DELF</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --oxford: #002147; --gold: #C5A059; --cream: #F8F9FA; --white: #FFFFFF; --error: #D32F2F; --success: #28A745; --text: #333333; }
        body { font-family: 'Montserrat', sans-serif; background-color: var(--cream); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar */
        .sidebar { width: 280px; background: var(--oxford); color: white; padding: 30px 20px; display: flex; flex-direction: column; }
        .sidebar h2 { font-size: 1.1rem; color: var(--gold); border-bottom: 1px solid var(--gold); padding-bottom: 20px; margin-bottom: 30px; text-align: center; }
        .skill-btn { background: transparent; border: 1px solid rgba(197, 160, 89, 0.2); color: white; padding: 15px; margin-bottom: 12px; border-radius: 10px; cursor: pointer; text-align: left; transition: 0.3s; display: flex; align-items: center; font-size: 0.9rem; }
        .skill-btn.active, .skill-btn:hover { background: var(--gold); color: var(--oxford); font-weight: 700; }

        /* Header */
        .header { background: white; padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #E0E0E0; }
        .admin-controls { display: flex; align-items: center; gap: 20px; }
        select { padding: 8px; border-radius: 5px; border: 1px solid var(--gold); font-family: 'Montserrat'; font-weight: 700; }

        /* Workspace */
        .workspace { flex: 1; padding: 40px; overflow-y: auto; display: flex; flex-direction: column; align-items: center; }
        .interaction-card { background: white; width: 100%; max-width: 900px; padding: 40px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.03); }
        
        /* Sophia Components */
        #content-area { min-height: 200px; font-size: 1.2rem; line-height: 1.8; }
        .audio-player { width: 100%; margin: 20px 0; }
        .word { cursor: pointer; padding: 2px 4px; border-radius: 4px; }
        .word:hover { background: rgba(197, 160, 89, 0.2); }
        .word.wrong { color: var(--error); border-bottom: 2px solid var(--error); }

        /* Info Panel */
        #info-panel { position: fixed; right: -420px; top: 0; width: 380px; height: 100vh; background: white; box-shadow: -10px 0 30px rgba(0,0,0,0.05); padding: 50px 30px; transition: 0.5s; z-index: 100; }
        #info-panel.open { right: 0; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <h2>RÉUSSITE DELF</h2>
        <button class="skill-btn" onclick="loadExercise('CO')"><i class="fas fa-headset"></i> Compréhension Orale</button>
        <button class="skill-btn" onclick="loadExercise('CE')"><i class="fas fa-book-open"></i> Compréhension Écrite</button>
        <button class="skill-btn" onclick="loadExercise('PE')"><i class="fas fa-pen-nib"></i> Production Écrite</button>
        <button class="skill-btn" onclick="loadExercise('PO')"><i class="fas fa-microphone"></i> Production Orale</button>
        <button class="skill-btn active" onclick="loadExercise('LECTURE')"><i class="fas fa-language"></i> Phonétique & Lecture</button>
    </aside>

    <main class="main-content" style="flex:1; display:flex; flex-direction:column;">
        <header class="header">
            <div class="student-welcome">Bienvenue, <span id="student-name" style="font-weight:700; color:var(--gold);">Chargement...</span></div>
            <div class="admin-controls">
                <label style="font-size: 0.7rem; font-weight:bold;">TESTER NIVEAU:</label>
                <select id="level-selector" onchange="loadExercise('LECTURE')">
                    <option value="A1">A1</option><option value="A2">A2</option>
                    <option value="B1" selected>B1</option><option value="B2">B2</option><option value="C1">C1</option>
                </select>
                <a href="admin.html" style="text-decoration:none; color:var(--oxford); font-weight:700; font-size:0.8rem;"><i class="fas fa-lock"></i> ADMIN</a>
            </div>
        </header>

        <section class="workspace">
            <div class="interaction-card">
                <h2 id="skill-title" style="margin-top:0; color:var(--oxford);">Sophia te prépare un exercice...</h2>
                <div id="content-area">
                    </div>
                <div id="feedback-msg" style="margin-top:20px; text-align:center; font-weight:600;"></div>
            </div>
        </section>
    </main>

    <div id="info-panel">
        <span onclick="this.parentElement.classList.remove('open')" style="cursor:pointer; float:right; font-size:2rem;">&times;</span>
        <h3 id="panel-title" style="color:var(--oxford); border-bottom:2px solid var(--gold);">Analyse de Sophia</h3>
        <div id="panel-body" style="margin-top:20px; line-height:1.6;"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCgog8tKspHy01ZHE8Dthl9O4W6lw1a_Ec",
            authDomain: "objectif-reussite-delf.firebaseapp.com",
            projectId: "objectif-reussite-delf",
            storageBucket: "objectif-reussite-delf.firebasestorage.app",
            messagingSenderId: "942279633770",
            appId: "1:942279633770:web:687ba6d819747eb29c1313"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- CARGAR PERFIL ---
        async function init() {
            const snap = await getDoc(doc(db, "Usuarios", "sergio")); // Ejemplo Sergio
            document.getElementById('student-name').innerText = snap.exists() ? snap.data().nombre : "Étudiant";
            loadExercise('LECTURE');
        }

        // --- EL MOTOR DE SOPHIA: CARGA DINÁMICA ---
        window.loadExercise = async (skill) => {
            const nivel = document.getElementById('level-selector').value;
            const area = document.getElementById('content-area');
            const title = document.getElementById('skill-title');
            
            area.innerHTML = `<div style="text-align:center;"><i class="fas fa-spinner fa-spin"></i> Sophia está consultando el material de ${nivel}...</div>`;

            // Simulamos la extracción de Sophia desde el material que subiste
            const snapMaterial = await getDoc(doc(db, "Materiales", nivel));
            const data = snapMaterial.data();

            if (skill === 'CO') {
                title.innerText = "Compréhension Orale - " + nivel;
                area.innerHTML = `
                    <p>Écoutez l'audio et répondez aux questions.</p>
                    <audio controls class="audio-player"><source src="${data.audios}" type="audio/mpeg"></audio>
                    <div style="margin-top:20px;">
                        <label>1. Qu'est-ce que l'homme veut acheter ?</label><br>
                        <input type="text" style="width:100%; padding:10px; margin-top:10px;" placeholder="Votre réponse...">
                    </div>
                `;
            } 
            else if (skill === 'CE') {
                title.innerText = "Compréhension Écrite - " + nivel;
                area.innerHTML = `
                    <p>Lisez le texte suivant. Cliquez sur les mots difficiles pour l'aide de Sophia.</p>
                    <div style="background:#f9f9f9; padding:20px; border-radius:10px; border-left:5px solid var(--gold);">
                        <span class="word" onclick="sophiaHelp('C\'est')">C'est</span> un 
                        <span class="word" onclick="sophiaHelp('article')">article</span> du 
                        <span class="word" onclick="sophiaHelp('journal')">journal</span>...
                    </div>
                `;
            }
            else if (skill === 'LECTURE') {
                title.innerText = "Phonétique & Lecture - " + nivel;
                area.innerHTML = `
                    <div id="lecture-text">Bonjour Sergio, prêt pour ton examen de nivel ${nivel}?</div>
                    <div style="margin-top:30px; display:flex; gap:10px; justify-content:center;">
                        <button onclick="speak()" style="padding:10px 20px; background:var(--oxford); color:white; border:none; border-radius:5px; cursor:pointer;">ESCUCHAR A SOPHIA</button>
                        <button onclick="record()" style="padding:10px 20px; background:var(--gold); color:var(--oxford); border:none; border-radius:5px; cursor:pointer;">REPETIR</button>
                    </div>
                `;
            }
        };

        window.sophiaHelp = (word) => {
            const panel = document.getElementById('info-panel');
            document.getElementById('panel-title').innerText = "Analyse : " + word;
            document.getElementById('panel-body').innerHTML = `Sophia analiza el contexto de <strong>${word}</strong> en tu Référentiel de nivel... <br><br> (Traducción y Gramática aparecerán aquí)`;
            panel.classList.add('open');
        };

        window.speak = () => {
            const text = document.getElementById('lecture-text').innerText;
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'fr-FR';
            window.speechSynthesis.speak(msg);
        };

        init();
    </script>
</body>
</html>
