<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mon DELF | Élève</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --oxford: #002147; --gold: #C5A059; --bg: #f4f7f9; }
        body { font-family: 'Montserrat', sans-serif; margin: 0; display: flex; height: 100vh; background: var(--bg); }
        .sidebar { width: 260px; background: var(--oxford); color: white; padding: 20px; }
        .header { background: white; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; flex: 1; }
        .skill-btn { width: 100%; padding: 15px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #C5A059; background: transparent; color: white; cursor: pointer; text-align: left; }
        .skill-btn:hover { background: var(--gold); color: var(--oxford); }
        /* SELECTOR OCULTO PARA ADMIN */
        #admin-selector { display: none; background: #fffbe6; border: 1px solid var(--gold); padding: 5px; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>
    <nav class="sidebar">
        <h2>RÉUSSITE</h2>
        <button class="skill-btn" onclick="window.loadSkill('CO')">Comprensión Oral</button>
        <button class="skill-btn" onclick="window.loadSkill('CE')">Comprensión Escrita</button>
    </aside>

    <main style="flex:1; display:flex; flex-direction:column;">
        <div class="header">
            <div>Bonjour, <span id="st-name" style="font-weight:bold;">...</span></div>
            <select id="admin-selector" onchange="window.changeLevelAdmin(this.value)">
                <option value="A1">Probar A1</option><option value="A2">Probar A2</option>
                <option value="B1">Probar B1</option><option value="B2">Probar B2</option><option value="C1">Probar C1</option>
            </select>
        </div>
        <div id="content" style="padding:40px;">Selecciona una habilidad.</div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js";
        const firebaseConfig = { apiKey: "AIzaSyCgog8tKspHy01ZHE8Dthl9O4W6lw1a_Ec", authDomain: "objectif-reussite-delf.firebaseapp.com", projectId: "objectif-reussite-delf", storageBucket: "objectif-reussite-delf.firebasestorage.app", messagingSenderId: "942279633770", appId: "1:942279633770:web:687ba6d819747eb29c1313" };
        const app = initializeApp(firebaseConfig); const db = getFirestore(app);

        let currentLevel = "";
        const params = new URLSearchParams(window.location.search);

        // LÓGICA DE LA LLAVE MAESTRA
        if(params.get('access') === 'admin') {
            document.getElementById('admin-selector').style.display = 'block';
            currentLevel = "B1"; // Nivel inicial de prueba
            document.getElementById('st-name').innerText = "Modo Admin";
        } else {
            // Carga normal del alumno
            const stId = params.get('id');
            const snap = await getDoc(doc(db, "Usuarios", stId));
            if(snap.exists()) {
                currentLevel = snap.data().nivel;
                document.getElementById('st-name').innerText = snap.data().nombre;
            }
        }

        window.changeLevelAdmin = (level) => {
            currentLevel = level;
            alert("Cambiado a vista de nivel: " + level);
            document.getElementById('content').innerHTML = "Nivel " + level + " cargado. Selecciona una habilidad.";
        };

        window.loadSkill = async (skill) => {
            const snap = await getDoc(doc(db, "BibliotecaEjercicios", currentLevel));
            const area = document.getElementById('content');
            if(!snap.exists()) { area.innerHTML = "Sophia no ha generado este nivel aún."; return; }
            
            const data = snap.data()[skill];
            area.innerHTML = `<h3>${skill} - ${currentLevel}</h3><p>${JSON.stringify(data)}</p>`;
        };
    </script>
</body>
</html>
