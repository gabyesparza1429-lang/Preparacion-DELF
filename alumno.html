<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace Étudiant | Réussite DELF</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --oxford: #002147; --gold: #C5A059; --cream: #F8F9FA; --white: #FFFFFF; --green: #28A745; --error: #D32F2F; }
        body { font-family: 'Montserrat', sans-serif; background-color: var(--cream); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        .sidebar { width: 280px; background: var(--oxford); color: white; padding: 30px 20px; flex-shrink: 0; box-shadow: 4px 0 15px rgba(0,0,0,0.1); }
        .sidebar h2 { color: var(--gold); font-size: 1.1rem; border-bottom: 1px solid var(--gold); padding-bottom: 20px; text-align: center; letter-spacing: 1px; }
        .skill-btn { width: 100%; padding: 15px; margin-bottom: 12px; border-radius: 10px; border: 1px solid rgba(197, 160, 89, 0.3); background: transparent; color: white; cursor: pointer; text-align: left; display: flex; align-items: center; transition: 0.3s; font-size: 0.9rem; }
        .skill-btn i { margin-right: 15px; width: 20px; text-align: center; }
        .skill-btn.active, .skill-btn:hover { background: var(--gold); color: var(--oxford); font-weight: bold; border-color: var(--gold); }

        .header { background: white; padding: 20px 40px; border-bottom: 1px solid #E0E0E0; display: flex; justify-content: space-between; align-items: center; width: 100%; box-sizing: border-box; }
        .workspace { flex: 1; padding: 40px; display: flex; justify-content: center; overflow-y: auto; background: var(--cream); }
        
        .exercise-card { background: white; padding: 45px; border-radius: 20px; width: 100%; max-width: 850px; box-shadow: 0 10px 40px rgba(0,0,0,0.03); height: fit-content; }
        .exercise-card h3 { color: var(--oxford); margin-top: 0; border-bottom: 2px solid var(--gold); display: inline-block; padding-bottom: 5px; margin-bottom: 25px; }
        
        .audio-player { width: 100%; margin: 20px 0; border-radius: 10px; }
        .consigne { background: #f0f4f8; padding: 15px; border-radius: 8px; border-left: 5px solid var(--oxford); font-style: italic; margin-bottom: 20px; font-size: 0.9rem; }
        .text-content { font-size: 1.1rem; line-height: 2; color: #444; margin-bottom: 30px; }
        .question-item { margin-bottom: 20px; padding: 15px; border: 1px solid #eee; border-radius: 8px; background: #fff; }
        
        #admin-selector { display: none; background: #fffbe6; padding: 8px; border-radius: 5px; font-weight: bold; border: 1px solid var(--gold); font-family: 'Montserrat'; }
    </style>
</head>
<body>
    <aside class="sidebar">
        <h2>RÉUSSITE DELF</h2>
        <button class="skill-btn" onclick="window.loadSkill('CO')"><i class="fas fa-headset"></i> Compréhension Orale</button>
        <button class="skill-btn" onclick="window.loadSkill('CE')"><i class="fas fa-book-open"></i> Compréhension Écrite</button>
        <button class="skill-btn" onclick="window.loadSkill('PE')"><i class="fas fa-pen-nib"></i> Production Écrite</button>
        <button class="skill-btn" onclick="window.loadSkill('PO')"><i class="fas fa-microphone"></i> Production Orale</button>
        <button class="skill-btn" onclick="window.loadSkill('PH')"><i class="fas fa-language"></i> Phonétique & Lecture</button>
    </aside>

    <main style="flex:1; display:flex; flex-direction:column;">
        <header class="header">
            <div style="font-size: 1rem;">Bonjour, <span id="st-name" style="font-weight:700; color:var(--gold);">Étudiant</span> | <span id="st-level" style="color: var(--oxford); font-weight:700;">Niveau...</span></div>
            <select id="admin-selector" onchange="window.changeLevelAdmin(this.value)">
                <option value="A1">Tester A1</option><option value="A2">Tester A2</option>
                <option value="B1" selected>Tester B1</option><option value="B2">Tester B2</option><option value="C1">Tester C1</option>
            </select>
        </header>
        
        <section class="workspace">
            <div class="exercise-card" id="content-display">
                <div style="text-align:center; color:#999;">
                    <i class="fas fa-magic fa-3x" style="margin-bottom:20px; color:var(--gold);"></i>
                    <p>Bienvenue. Sophia attend vos instructions.<br>Sélectionnez una competencia para iniciar.</p>
                </div>
            </div>
        </section>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyCgog8tKspHy01ZHE8Dthl9O4W6lw1a_Ec", 
            authDomain: "objectif-reussite-delf.firebaseapp.com", 
            projectId: "objectif-reussite-delf", 
            storageBucket: "objectif-reussite-delf.firebasestorage.app", 
            messagingSenderId: "942279633770", 
            appId: "1:942279633770:web:687ba6d819747eb29c1313" 
        };
        
        const app = initializeApp(firebaseConfig); 
        const db = getFirestore(app);

        let currentLevel = "B1";
        const params = new URLSearchParams(window.location.search);

        async function init() {
            if(params.get('access') === 'admin') {
                document.getElementById('admin-selector').style.display = 'block';
                document.getElementById('st-name').innerText = "Gaby (Admin)";
            } else {
                const stId = params.get('id');
                const snap = await getDoc(doc(db, "Usuarios", stId || "default"));
                if(snap.exists()) {
                    currentLevel = snap.data().nivel;
                    document.getElementById('st-name').innerText = snap.data().nombre;
                    document.getElementById('st-level').innerText = "Niveau " + currentLevel;
                }
            }
        }

        window.changeLevelAdmin = (l) => {
            currentLevel = l;
            document.getElementById('content-display').innerHTML = `<div style="text-align:center; color:var(--gold);"><i class="fas fa-sync fa-spin"></i> Cargando Nivel ${l}...</div>`;
            window.loadSkill('CE'); // Carga CE por defecto al cambiar nivel
        };

        window.loadSkill = async (skill) => {
            const area = document.getElementById('content-display');
            area.innerHTML = `<div style="text-align:center;"><i class="fas fa-circle-notch fa-spin fa-2x"></i><br>Sophia consulta la biblioteca de ${currentLevel}...</div>`;
            
            const snap = await getDoc(doc(db, "BibliotecaEjercicios", currentLevel));
            if(!snap.exists()) { 
                area.innerHTML = `<div style="text-align:center; color:var(--error); padding:20px;">
                    <i class="fas fa-exclamation-triangle fa-2x"></i><br><br>
                    Sophia no ha generado la biblioteca para el <strong>Nivel ${currentLevel}</strong>.<br>
                    Por favor, ve al Panel Admin y presiona "GENERAR BIBLIOTECA".</div>`; 
                return; 
            }
            
            const data = snap.data()[skill];
            if(!data) { area.innerHTML = "Sophia no encontró ejercicios para esta habilidad."; return; }

            // DIBUJAR EJERCICIOS HUMANOS (NO JSON)
            if(skill === 'CO') {
                area.innerHTML = `
                    <h3>Compréhension Orale</h3>
                    <div class="consigne"><i class="fas fa-headphones"></i> ${data.consigna}</div>
                    <audio controls class="audio-player"><source src="${data.audio}" type="audio/mpeg"></audio>
                    <div class="question-item" style="border: 2px dashed var(--gold); text-align:center;">
                        <i class="fas fa-brain"></i> Sophia está analizando el audio para generar preguntas reales...
                    </div>
                `;
            } 
            else if(skill === 'CE') {
                area.innerHTML = `
                    <h3>Compréhension Écrite</h3>
                    <div class="consigne">Lisez le texte et répondez aux questions.</div>
                    <div class="text-content">${data.texto || 'Cargando texto...'}</div>
                    <div id="questions-area">
                        ${data.preguntas ? data.preguntas.map((p, i) => `<div class="question-item"><strong>${i+1}.</strong> ${p}</div>`).join('') : ''}
                    </div>
                `;
            }
            else {
                area.innerHTML = `<h3>${skill}</h3><div class="consigne">${data.consigna || 'Sophia está lista.'}</div><p>Contenido en desarrollo...</p>`;
            }
        };

        init();
    </script>
</body>
</html>
