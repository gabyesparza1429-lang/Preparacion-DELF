<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Vista Alumno | Réussite DELF</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --oxford: #002147; --gold: #C5A059; --bg: #f4f7f9; }
        body { font-family: 'Montserrat', sans-serif; margin: 0; background: var(--bg); }
        .top-nav { background: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; }
        .btn-back { background: var(--oxford); color: white; padding: 8px 15px; border-radius: 5px; text-decoration: none; font-size: 0.8rem; }
        .container { padding: 40px; text-align: center; }
        .locked { display: none; } /* Oculto por defecto */
        .unlocked { display: block; }
    </style>
</head>
<body>

    <nav class="top-nav">
        <div style="font-weight: bold; color: var(--oxford);">MODO ESTUDIANTE</div>
        <a href="admin.html" class="btn-back"><i class="fas fa-lock"></i> REGRESAR A ADMIN</a>
    </nav>

    <div id="content_area" class="container">
        <h2 id="status_msg">Cargando material...</h2>
        <div id="exercise_container" style="margin-top:20px; background:white; padding:30px; border-radius:15px; min-height:300px; box-shadow:0 5px 15px rgba(0,0,0,0.05);">
            <p>Selecciona una habilidad en el menú para comenzar.</p>
        </div>
    </div>

    <script>
        // Lógica de acceso sin contraseña para el Admin
        const urlParams = new URLSearchParams(window.location.search);
        const access = urlParams.get('access');

        if (access === 'admin') {
            document.getElementById('status_msg').innerText = "Acceso de Administrador: Visualizando contenido.";
            console.log("Modo Preview Activo");
        } else {
            // Aquí iría la lógica de login normal para alumnos reales en el futuro
            document.getElementById('status_msg').innerText = "Por favor, inicia sesión para ver tus cursos.";
        }
    </script>
</body>
</html>
