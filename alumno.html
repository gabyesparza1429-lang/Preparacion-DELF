<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Objectif Réussite DELF - Espace Étudiant</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --oxford: #13293D;
            --azure: #006494;
            --blue-light: #247BA0;
            --blanco: #FFFFFF;
            --gris-fondo: #F4F7F6;
            --gold: #D4AF37;
            --success: #2ec4b6;
            --error: #e71d36;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: var(--gris-fondo);
            display: flex;
            height: 100vh;
            overflow: hidden;
            color: #333;
        }

        /* --- MENÚ LATERAL --- */
        .sidebar {
            width: 320px;
            background-color: var(--oxford);
            display: flex;
            flex-direction: column;
            border-right: 4px solid var(--gold);
            z-index: 10;
        }

        .sidebar-header {
            padding: 25px 20px;
            background-color: rgba(0,0,0,0.2);
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .sidebar-header h2 {
            color: var(--blanco);
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .sidebar-header p {
            color: var(--gold);
            font-size: 0.8rem;
            margin-top: 5px;
            font-weight: 500;
        }

        .unit-menu-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px 10px;
        }

        .unit-wrapper {
            margin-bottom: 8px;
            border-radius: 6px;
            overflow: hidden;
        }

        .unit-toggle-btn {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: none;
            color: var(--blanco);
            padding: 12px 15px;
            text-align: left;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }

        .unit-toggle-btn:hover, .unit-toggle-btn.active {
            background: rgba(255,255,255,0.15);
            color: var(--gold);
        }

        .submenu-activities {
            background: rgba(0,0,0,0.15);
            padding: 5px 0;
        }

        .activity-link-btn {
            width: 100%;
            background: none;
            border: none;
            color: #ccc;
            padding: 8px 15px;
            padding-left: 30px;
            text-align: left;
            font-size: 0.8rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            transition: all 0.2s;
        }

        .activity-link-btn:hover {
            color: var(--blanco);
            background: rgba(255,255,255,0.05);
        }

        .activity-link-btn.active {
            color: var(--gold);
            font-weight: 700;
            background: rgba(255,255,255,0.08);
        }

        /* --- CONTENEDOR PRINCIPAL --- */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* PESTAÑAS DE HABILIDADES */
        .skills-nav {
            display: flex;
            background-color: var(--blanco);
            border-bottom: 2px solid #e0e0e0;
            padding: 0 20px;
        }

        .skill-tab-btn {
            background: none;
            border: none;
            padding: 18px 25px;
            font-size: 0.85rem;
            font-weight: 700;
            color: #777;
            cursor: pointer;
            position: relative;
            transition: color 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .skill-tab-btn:hover {
            color: var(--azure);
        }

        .skill-tab-btn.active {
            color: var(--oxford);
        }

        .skill-tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 4px;
            background-color: var(--gold);
        }

        /* ESPACIO DE TRABAJO */
        .workspace-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 40px;
            display: flex;
            justify-content: center;
        }

        .exercise-card {
            background-color: var(--blanco);
            width: 100%;
            max-width: 800px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            padding: 35px;
            align-self: flex-start;
        }

        .exercise-header {
            border-bottom: 2px solid var(--gris-fondo);
            padding-bottom: 20px;
            margin-bottom: 25px;
        }

        .exercise-header h1 {
            font-size: 1.4rem;
            color: var(--oxford);
            font-weight: 700;
        }

        /* CONTENEDOR DE LECTURA (CE) */
        .reading-container {
            background-color: #f8f9fa;
            border-left: 5px solid var(--azure);
            padding: 20px;
            border-radius: 4px;
            margin-bottom: 25px;
            color: #333;
            line-height: 1.6;
            white-space: pre-wrap;
            font-size: 0.95rem;
        }

        /* REPRODUCTOR DE AUDIO (CO) */
        .audio-player-container {
            background: #f0f4f8;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .audio-player-container audio {
            flex: 1;
        }

        /* ESTRUCTURA DE PREGUNTAS */
        .question-block {
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px dashed #e0e0e0;
        }

        .question-text {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--oxford);
            margin-bottom: 12px;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .option-label {
            display: flex;
            align-items: center;
            background-color: var(--gris-fondo);
            padding: 12px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            border: 2px solid transparent;
            transition: all 0.2s;
        }

        .option-label:hover {
            background-color: #eef2f5;
        }

        .option-label input {
            margin-right: 12px;
            accent-color: var(--azure);
            width: 16px;
            height: 16px;
        }

        /* ESTADOS DE CALIFICACIÓN */
        .option-label.correct-choice {
            background-color: rgba(46, 196, 182, 0.15);
            border-color: var(--success);
            color: #0f5c53;
        }

        .option-label.incorrect-choice {
            background-color: rgba(231, 29, 54, 0.12);
            border-color: var(--error);
            color: #8a101f;
        }

        /* BOTÓN DE ACCIÓN */
        .action-btn {
            background-color: var(--azure);
            color: var(--blanco);
            border: none;
            padding: 14px 30px;
            font-size: 0.9rem;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            display: block;
            width: 100%;
            margin-top: 20px;
        }

        .action-btn:hover {
            background-color: var(--oxford);
        }

        .feedback-banner {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            font-weight: 600;
            text-align: center;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <h2>Espace Étudiant</h2>
            <p id="label-nivel-activo">Chargement du niveau...</p>
        </div>
        <div class="unit-menu-container" id="sidebar-dynamic-menu">
            </div>
    </div>

    <div class="main-content">
        <div class="skills-nav">
            <button class="skill-tab-btn active" id="tab-CO" onclick="cambiarHabilidadGlobal('CO')">
                <i class="fas fa-headphones"></i> Compréhension Orale
            </button>
            <button class="skill-tab-btn" id="tab-CE" onclick="cambiarHabilidadGlobal('CE')">
                <i class="fas fa-file-alt"></i> Compréhension Écrite
            </button>
            <button class="skill-tab-btn" id="tab-PE" onclick="cambiarHabilidadGlobal('PE')">
                <i class="fas fa-pen"></i> Production Écrite
            </button>
            <button class="skill-tab-btn" id="tab-PO" onclick="cambiarHabilidadGlobal('PO')">
                <i class="fas fa-comments"></i> Production Orale
            </button>
        </div>

        <div class="workspace-scroll" id="dynamic-workspace-target">
            </div>
    </div>

    <script>
        // ========================================================
        // CONFIGURACIÓN DE TU PROYECTO FIREBASE
        // ========================================================
        // NOTA: Recuerda pegar tus credenciales reales aquí antes de correrlo
        const firebaseConfig = {
            apiKey: "TU_API_KEY_REAL", 
            authDomain: "TU_PROJECT_ID.firebaseapp.com",
            projectId: "TU_PROJECT_ID",
            storageBucket: "TU_PROJECT_ID.appspot.com",
            messagingSenderId: "TU_SENDER_ID",
            appId: "TU_APP_ID"
        };

        // Inicializar Firebase Compat
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // VARIABLES DE CONTROL DE ESTADO GLOBAL
        let currentNivel = "A1"; 
        let currentSkill = "CO";  
        let unidadesCache = {};   
        let openUnitsState = {};  

        let currentUnitId = null;
        let currentExerciseIndex = 0;

        // Inicialización al cargar la página
        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('label-nivel-activo').innerText = `Niveau DELF ${currentNivel}`;
            cargarBibliotecaEjercicios();
        });

        // DESCARGA INICIAL DE DATOS DESDE FIREBASE
        function cargarBibliotecaEjercicios() {
            db.collection("BibliotecaEjercicios").document(currentNivel).collection("Unidades")
            .get()
            .then((querySnapshot) => {
                unidadesCache = {};
                querySnapshot.forEach((doc) => {
                    unidadesCache[doc.id] = doc.data();
                });
                generarMenuJerarquico();
            })
            .catch((error) => {
                console.error("Error al descargar biblioteca de Firebase: ", error);
            });
        }

        // CAMBIO ENTRE PESTAÑAS (CO, CE, PE, PO)
        function cambiarHabilidadGlobal(nuevaHabilidad) {
            currentSkill = nuevaHabilidad;
            
            // Alternar clases CSS activas en las pestañas
            document.querySelectorAll('.skill-tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`tab-${nuevaHabilidad}`).classList.add('active');

            // Resetear estados del ejercicio para evitar basura visual
            currentUnitId = null;
            currentExerciseIndex = 0;

            // Redibujar el menú lateral con el filtro dinámico de la nueva habilidad
            generarMenuJerarquico();
        }

        // CONTROL DE MENÚ APERTURA/CIERRE
        window.toggleUnitMenu = function(uId) {
            openUnitsState[uId] = !openUnitsState[uId];
            generarMenuJerarquico();
        };

        // ========================================================
        // GENERACIÓN DEL MENÚ LATERAL CON FILTRADO DINÁMICO
        // ========================================================
        function generarMenuJerarquico() {
            const menuContainer = document.getElementById('sidebar-dynamic-menu');
            const target = document.getElementById('dynamic-workspace-target');
            menuContainer.innerHTML = "";

            const keys = Object.keys(unidadesCache).sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));

            if (keys.length === 0) {
                target.innerHTML = `<div style="text-align: center; padding: 40px; color: #888;"><p>Aucun exercice chargé pour le moment.</p></div>`;
                return;
            }

            if (currentUnitId === null) {
                target.innerHTML = `<div style="text-align: center; padding: 60px; color: var(--oxford); margin-top:30px;"><p style="font-weight: 600;">Veuillez choisir une activité dans le menu de gauche pour commencer.</p></div>`;
            }

            let unidadesVisibles = 0;

            keys.forEach((uId) => {
                const u = unidadesCache[uId];
                let ejerciciosHabilidad = u[currentSkill] || [];
                
                // Si la unidad no tiene ejercicios para esta habilidad, se oculta del menú
                if (ejerciciosHabilidad.length === 0) {
                    return; 
                }

                unidadesVisibles++;

                const isUnitOpen = openUnitsState[uId] === true;
                const displayStyle = isUnitOpen ? 'flex' : 'none';
                const chevronIcon = isUnitOpen ? 'fa-chevron-down' : 'fa-chevron-right';

                let unitWrapper = document.createElement('div');
                unitWrapper.className = 'unit-wrapper';
                unitWrapper.innerHTML = `
                    <button class="unit-toggle-btn ${currentUnitId === uId ? 'active' : ''}" onclick="window.toggleUnitMenu('${uId}')">
                        <span><i class="fas fa-book" style="color:var(--gold); margin-right:8px;"></i>${u.unidad || uId} ${u.tema ? `- ${u.tema}` : ''}</span>
                        <i class="fas ${chevronIcon}" style="font-size:0.7rem; color:var(--gold);"></i>
                    </button>
                `;

                let subContainer = document.createElement('div');
                subContainer.className = 'submenu-activities';
                subContainer.style.display = displayStyle;

                ejerciciosHabilidad.forEach((ej, eIdx) => {
                    const esActivo = (currentUnitId === uId && currentExerciseIndex === eIdx);
                    let tituloLimpio = "";
                    if (ej.instruccion) {
                        let matchActividad = ej.instruccion.match(/Activité\s*\d+/i);
                        if (matchActividad) tituloLimpio = matchActividad[0]; 
                    }
                    if (!tituloLimpio) tituloLimpio = `Activité ${eIdx + 1}`;

                    subContainer.innerHTML += `
                        <button class="activity-link-btn ${esActivo ? 'active' : ''}" onclick="window.cargarActividadDirecta('${uId}', ${eIdx})">
                            <i class="fas fa-play" style="font-size:0.6rem; margin-right:6px;"></i>${tituloLimpio}
                        </button>
                    `;
                });

                unitWrapper.appendChild(subContainer);
                menuContainer.appendChild(unitWrapper);
            });

            if (unidadesVisibles === 0) {
                menuContainer.innerHTML = `<div style="padding: 15px; font-size: 0.8rem; color: #bbb; text-align: center; font-style: italic;"><i class="fas fa-folder-open" style="display:block; margin-bottom:8px; font-size:1.2rem;"></i>Aucune unité disponible pour cette compétence.</div>`;
                target.innerHTML = `<div style="text-align: center; padding: 60px; color: #888; margin-top:30px;"><p>Aucun exercice disponible pour cette section.</p></div>`;
            }
        }

        // CARGA Y PINTADO DEL EJERCICIO EN PANTALLA
        window.cargarActividadDirecta = function(uId, index) {
            currentUnitId = uId;
            currentExerciseIndex = index;
            
            generarMenuJerarquico(); 

            const target = document.getElementById('dynamic-workspace-target');
            const unidadDatos = unidadesCache[uId];
            const ejercicioActivo = unidadDatos[currentSkill][index];

            target.innerHTML = `
                <div class="exercise-card">
                    <div class="exercise-header">
                        <h1>${ejercicioActivo.instruccion || 'Exercice'}</h1>
                    </div>
                    <div id="media-content-placement"></div>
                    <div id="questions-placement"></div>
                    <button class="action-btn" id="btn-principal-evaluar" onclick="evaluarRespuestasEstudiante()">Vérifier mes réponses</button>
                    <div id="feedback-placement"></div>
                </div>
            `;

            const mediaBox = document.getElementById('media-content-placement');

            // 1. CONDICIÓN CO: Audio
            if (currentSkill === "CO" && ejercicioActivo.ruta_audio) {
                mediaBox.innerHTML = `
                    <div class="audio-player-container">
                        <i class="fas fa-volume-up" style="color:var(--azure); font-size:1.2rem;"></i>
                        <audio controls src="audios/${ejercicioActivo.ruta_audio}"></audio>
                    </div>
                `;
            }

            // 2. CONDICIÓN CE: Documento de texto/Lectura
            if (currentSkill === "CE" && ejercicioActivo.texto_lectura) {
                mediaBox.innerHTML = `
                    <div class="reading-container">
                        <strong style="display:block; margin-bottom:10px; color:var(--oxford);">
                            <i class="fas fa-file-text" style="margin-right:8px;"></i> Document de lecture :
                        </strong>
                        ${ejercicioActivo.texto_lectura}
                    </div>
                `;
            }

            // 3. PINTADO DE PREGUNTAS
            const qBox = document.getElementById('questions-placement');
            if (ejercicioActivo.preguntas && ejercicioActivo.preguntas.length > 0) {
                ejercicioActivo.preguntas.forEach((q, qIdx) => {
                    let opcionesHTML = "";
                    q.opciones.forEach((opc) => {
                        opcionesHTML += `
                            <label class="option-label q-group-${qIdx}">
                                <input type="radio" name="question-${qIdx}" value="${opc}">
                                <span>${opc}</span>
                            </label>
                        `;
                    });

                    qBox.innerHTML += `
                        <div class="question-block" id="block-q-${qIdx}">
                            <div class="question-text">${qIdx + 1}. ${q.pregunta}</div>
                            <div class="options-grid">${opcionesHTML}</div>
                        </div>
                    `;
                });
            } else {
                qBox.innerHTML = `<p style="color:#666; font-style:italic;">Rédaction ou réponse libre requise pour cet exercice.</p>`;
                document.getElementById('btn-principal-evaluar').style.display = 'none';
            }
        };

        // LÓGICA DE EVALUACIÓN
        window.evaluarRespuestasEstudiante = function() {
            const ejercicioActivo = unidadesCache[currentUnitId][currentSkill][currentExerciseIndex];
            let aciertos = 0;
            let totalPreguntas = ejercicioActivo.preguntas.length;

            ejercicioActivo.preguntas.forEach((q, qIdx) => {
                const seleccionada = document.querySelector(`input[name="question-${qIdx}"]:checked`);
                const todasLasOpcionesDeQ = document.querySelectorAll(`.q-group-${qIdx}`);

                todasLasOpcionesDeQ.forEach(lbl => {
                    lbl.classList.remove('correct-choice', 'incorrect-choice');
                    const radioInput = lbl.querySelector('input');
                    
                    if (radioInput.value === q.respuesta_correcta) {
                        lbl.classList.add('correct-choice');
                    }
                    
                    if (seleccionada && radioInput === seleccionada && seleccionada.value !== q.respuesta_correcta) {
                        lbl.classList.add('incorrect-choice');
                    }
                });

                if (seleccionada && seleccionada.value === q.respuesta_correcta) {
                    aciertos++;
                }
            });

            const feedBox = document.getElementById('feedback-placement');
            const porcentaje = (aciertos / totalPreguntas) * 100;

            if (porcentaje >= 60) {
                feedBox.innerHTML = `
                    <div class="feedback-banner" style="background-color:rgba(46,196,182,0.15); color:#0f5c53;">
                        <i class="fas fa-check-circle" style="margin-right:8px;"></i> Score : ${aciertos} / ${totalPreguntas} (${porcentaje.toFixed(0)}%) - Félicitations !
                    </div>
                `;
            } else {
                feedBox.innerHTML = `
                    <div class="feedback-banner" style="background-color:rgba(231,29,54,0.12); color:#8a101f;">
                        <i class="fas fa-exclamation-circle" style="margin-right:8px;"></i> Score : ${aciertos} / ${totalPreguntas} (${porcentaje.toFixed(0)}%) - Continuez à pratiquer !
                    </div>
                `;
            }
        };
    </script>
</body>
</html>
