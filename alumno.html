<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mon Espace DELF | Réussite</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --oxford: #002147; --gold: #C5A059; --cream: #F8F9FA; --white: #FFFFFF; --green: #28A745; }
        body { font-family: 'Montserrat', sans-serif; margin: 0; display: flex; height: 100vh; background: var(--cream); overflow: hidden; }
        .sidebar { width: 280px; background: var(--oxford); color: white; padding: 30px 20px; flex-shrink: 0; display: flex; flex-direction: column; }
        .logo-area { text-align: center; margin-bottom: 40px; border-bottom: 1px solid var(--gold); padding-bottom: 20px; }
        .skill-btn { width: 100%; padding: 15px; margin-bottom: 10px; border-radius: 10px; border: 1px solid rgba(197, 160, 89, 0.3); background: transparent; color: white; cursor: pointer; text-align: left; }
        .skill-btn:hover { background: var(--gold); color: var(--oxford); font-weight: 700; }
        .header { background: white; padding: 15px 40px; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; width: 100%; box-sizing: border-box; }
        .progress-bar { height: 8px; background: #eee; border-radius: 10px; width: 200px; overflow: hidden; margin-top: 5px; }
        .progress-fill { height: 100%; background: var(--green); width: 0%; transition: 1s; }
        .workspace { flex: 1; padding: 40px; overflow-y: auto; display: grid; grid-template-columns: 2fr 1fr; gap: 30px; }
        .card { background: white; padding: 35px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.03); }
        .sophia-tips { background: var(--oxford); color: white; padding: 25px; border-radius: 20px; height: fit-content; }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="logo-area"><i class="fas fa-graduation-cap" style="font-size:2.5rem; color:var(--gold);"></i><div>RÉUSSITE DELF</div></div>
        <button class="skill-btn" onclick="window.loadSkill('CO')"><i class="fas fa-headset"></i> Audio (CO)</button>
        <button class="skill-btn" onclick="window.loadSkill('CE')"><i class="fas fa-book-open"></i> Lecture (CE)</button>
        <button class="skill-btn" onclick="window.loadSkill('PH')"><i class="fas fa-language"></i> Phonétique</button>
    </aside>

    <main style="flex:1; display:flex; flex-direction:column;">
        <header class="header">
            <div>
                <strong>Bonjour, <span id="st-name" style="color:var(--gold);">...</span></strong>
                <div class="progress-bar"><div id="st-progress" class="progress-fill"></div></div>
            </div>
            <div style="display:flex; gap:20px; align-items:center;">
                <div style="text-align:center;"><small>NIVEAU</small><div id="st-level" style="font-weight:700;">--</div></div>
                <div style="text-align:center;"><small>EXAMEN</small><div id="st-date" style="font-weight:700;">--/--/--</div></div>
                <div style="text-align:center;"><div id="st-days" style="font-size:1.5rem; font-weight:700; color:var(--green);">0</div><small>JOURS</small></div>
            </div>
        </header>
        <section class="workspace">
            <div class="card" id="main-content">Sélectionnez una competencia.</div>
            <aside class="sophia-tips">
                <h4 style="color:var(--gold);"><i class="fas fa-robot"></i> Sophia Tips</h4>
                <div id="tips-area" style="font-size:0.8rem; border-left:2px solid var(--gold); padding-left:10px;">Sophia está analizando tu progreso para darte recomendaciones personalizadas.</div>
            </aside>
        </section>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
        import { getFirestore, doc, getDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js";
        const firebaseConfig = { apiKey: "AIzaSyCgog8tKspHy01ZHE8Dthl9O4W6lw1a_Ec", authDomain: "objectif-reussite-delf.firebaseapp.com", projectId: "objectif-reussite-delf", storageBucket: "objectif-reussite-delf.firebasestorage.app", messagingSenderId: "942279633770", appId: "1:942279633770:web:687ba6d819747eb29c1313" };
        const app = initializeApp(firebaseConfig); const db = getFirestore(app);

        let studentId = new URLSearchParams(window.location.search).get('id');
        let currentLevel = "B1";

        async function init() {
            if(studentId) {
                const snap = await getDoc(doc(db, "Usuarios", studentId.toLowerCase().trim()));
                if(snap.exists()){
                    const d = snap.data();
                    currentLevel = d.nivel;
                    document.getElementById('st-name').innerText = d.nombre;
                    document.getElementById('st-level').innerText = d.nivel;
                    document.getElementById('st-date').innerText = d.fecha_certificacion;
                    document.getElementById('st-progress').style.width = (d.progreso || 0) + "%";
                    const diff = Math.ceil((new Date(d.fecha_certificacion) - new Date()) / (1000 * 60 * 60 * 24));
                    document.getElementById('st-days').innerText = diff > 0 ? diff : 0;
                    
                    // CONTADOR REAL DE TIEMPO
                    setInterval(async () => { await updateDoc(doc(db, "Usuarios", studentId.toLowerCase()), { minutos_estudio: increment(1) }); }, 60000);
                }
            }
        }

        window.loadSkill = async (skill) => {
            const area = document.getElementById('main-content');
            const snap = await getDoc(doc(db, "BibliotecaEjercicios", currentLevel));
            if(!snap.exists()) { area.innerHTML = "Sophia aún no ha procesado este nivel."; return; }
            const data = snap.data()[skill];
            if(skill === 'CO') area.innerHTML = `<h3>Compréhension Orale</h3><audio controls style="width:100%"><source src="${data.audio}"></audio><div style="margin-top:20px;">${data.ejercicios.map(ex => `<div style="margin-bottom:10px;"><strong>Ex ${ex.id}:</strong> ${ex.p}</div>`).join('')}</div>`;
            else area.innerHTML = `<h3>${skill}</h3><p>${data.texto || 'Contenido...'}</p>`;
        };

        init();
    </script>
</body>
</html>
