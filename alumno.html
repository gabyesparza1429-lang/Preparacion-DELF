<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mon Espace DELF | Réussite</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --oxford: #002147; --gold: #C5A059; --cream: #F8F9FA; --green: #28A745; }
        body { font-family: 'Montserrat', sans-serif; margin: 0; display: flex; height: 100vh; background: var(--cream); overflow: hidden; }
        .sidebar { width: 280px; background: var(--oxford); color: white; padding: 30px 20px; flex-shrink: 0; }
        .skill-btn { width: 100%; padding: 15px; margin-bottom: 10px; border-radius: 10px; border: 1px solid rgba(197, 160, 89, 0.3); background: transparent; color: white; cursor: pointer; text-align: left; display: flex; align-items: center; gap: 12px; }
        .skill-btn.active { background: var(--gold); color: var(--oxford); font-weight: 700; }
        .header { background: white; padding: 20px 40px; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; }
        .workspace { flex: 1; padding: 40px; overflow-y: auto; display: grid; grid-template-columns: 2fr 1fr; gap: 30px; }
        .card { background: white; padding: 35px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.03); }
        .progress-bar { height: 8px; background: #eee; border-radius: 10px; width: 200px; overflow: hidden; margin-top: 5px; }
        .progress-fill { height: 100%; background: var(--green); width: 0%; transition: 1s; }
        .unit-box { border-left: 4px solid var(--gold); padding: 15px; margin-bottom: 25px; background: #fff; border-radius: 0 10px 10px 0; }
    </style>
</head>
<body>
    <aside class="sidebar">
        <h2 style="color:var(--gold); font-size:1rem; text-align:center; margin-bottom: 30px;">RÉUSSITE DELF</h2>
        <button class="skill-btn active" onclick="loadSkill('PARCOURS', this)"><i class="fas fa-route"></i> Mon Parcours</button>
        <button class="skill-btn" onclick="loadSkill('CO', this)"><i class="fas fa-headphones"></i> Comprensión Oral</button>
        <button class="skill-btn" onclick="loadSkill('CE', this)"><i class="fas fa-book-open"></i> Comprensión Escrita</button>
        <button class="skill-btn" onclick="loadSkill('PE', this)"><i class="fas fa-pen-nib"></i> Expresión Escrita</button>
        <button class="skill-btn" onclick="loadSkill('PO', this)"><i class="fas fa-comments"></i> Expresión Oral</button>
        <button class="skill-btn" onclick="loadSkill('CARNET', this)"><i class="fas fa-list-check"></i> Mon Carnet</button>
    </aside>

    <main style="flex:1; display:flex; flex-direction:column; overflow:hidden;">
        <header class="header">
            <div>
                <strong>Bonjour, <span id="st-name" style="color:var(--gold);">...</span></strong>
                <div style="font-size: 0.7rem; color: #888;">CLASE: <span id="st-class">--</span></div>
                <div class="progress-bar"><div id="st-progress" class="progress-fill"></div></div>
            </div>
            <div style="display:flex; gap:30px; align-items:center;">
                <div style="text-align:center;"><small>NIVEAU</small><div id="st-level" style="font-weight:700;">--</div></div>
                <div style="text-align:center;"><div id="st-days" style="font-size:1.5rem; font-weight:700; color:var(--green);">0</div><small>JOURS RESTANTS</small></div>
            </div>
        </header>

        <section class="workspace">
            <div id="main-content" class="card">Chargement...</div>
            <div class="card" style="background:var(--oxford); color:white;">
                <h4 style="color:var(--gold);">Sophia Tips</h4>
                <p id="tips-area" style="font-size:0.85rem;">Bienvenue dans votre préparation personnalisée.</p>
            </div>
        </section>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyCgog8tKspHy01ZHE8Dthl9O4W6lw1a_Ec", authDomain: "objectif-reussite-delf.firebaseapp.com", projectId: "objectif-reussite-delf", storageBucket: "objectif-reussite-delf.firebasestorage.app", messagingSenderId: "942279633770", appId: "1:942279633770:web:687ba6d819747eb29c1313" };
        const app = initializeApp(firebaseConfig); const db = getFirestore(app);

        const params = new URLSearchParams(window.location.search);
        const studentId = params.get('id');
        let currentLevel = params.get('level') || "";

        async function init() {
            if(!studentId) return;

            if(studentId === 'admin_preview') {
                document.getElementById('st-name').innerText = "Vista Previa";
                document.getElementById('st-level').innerText = currentLevel;
                loadSkill('PARCOURS', document.querySelector('.skill-btn.active'));
                return;
            }

            const snap = await getDoc(doc(db, "Usuarios", studentId.toLowerCase().trim()));
            if(snap.exists()){
                const d = snap.data();
                currentLevel = d.nivel;
                document.getElementById('st-name').innerText = d.nombre;
                document.getElementById('st-class').innerText = d.clase || "General";
                document.getElementById('st-level').innerText = d.nivel;
                document.getElementById('st-progress').style.width = (d.progreso || 0) + "%";
                
                if(d.fecha_certificacion) {
                    const diff = Math.ceil((new Date(d.fecha_certificacion) - new Date()) / (1000 * 60 * 60 * 24));
                    document.getElementById('st-days').innerText = diff > 0 ? diff : 0;
                }
                loadSkill('PARCOURS', document.querySelector('.skill-btn.active'));
            }
        }

        window.loadSkill = async (skill, btn) => {
            document.querySelectorAll('.skill-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const area = document.getElementById('main-content');
            
            const snap = await getDoc(doc(db, "BibliotecaEjercicios", currentLevel));
            if(!snap.exists()) {
                area.innerHTML = `<h3>¡Lo sentimos!</h3><p>Aún no hay material generado para el nivel <strong>${currentLevel}</strong>.</p>`;
                return;
            }

            const data = snap.data();
            const itinerario = data.itinerario || data.itinerario_completo || [];

            if(skill === 'PARCOURS') {
                area.innerHTML = `<h3>Mi Ruta de Aprendizaje ${currentLevel}</h3><p style="font-size:0.9rem; color:#666;">Selecciona una habilidad en el menú izquierdo para ver tus ejercicios.</p>`;
                itinerario.forEach(u => {
                    area.innerHTML += `
                        <div class="unit-box">
                            <strong>Unité ${u.unite || u.unidad}:</strong> ${u.tema || u.titulo}
                            <div style="display:flex; gap:10px; margin-top:10px; font-size:0.75rem;">
                                <span style="background:#eee; padding:2px 8px; border-radius:4px;">CO</span>
                                <span style="background:#eee; padding:2px 8px; border-radius:4px;">CE</span>
                                <span style="background:#eee; padding:2px 8px; border-radius:4px;">PE</span>
                                <span style="background:#eee; padding:2px 8px; border-radius:4px;">PO</span>
                            </div>
                        </div>`;
                });
            } else if(['CO', 'CE', 'PE', 'PO'].includes(skill)) {
                const names = { CO: 'Comprensión Oral', CE: 'Comprensión Escrita', PE: 'Expresión Escrita', PO: 'Expresión Oral' };
                area.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                        <h3>${names[skill]}</h3>
                        <select id="unit-filter" style="padding:8px; border-radius:8px; border:1px solid var(--gold); font-family:Montserrat;" onchange="filterUnits(this.value, '${skill}')">
                            <option value="all">Todas las Clases / Unidades</option>
                            ${itinerario.map(u => `<option value="${u.unite || u.unidad}">Clase ${u.unite || u.unidad}</option>`).join('')}
                        </select>
                    </div>
                    <div id="units-container"></div>`;

                filterUnits('all', skill);
            } else if(skill === 'CARNET') {
                area.innerHTML = `<h3>Carnet de Bord</h3>`;
                let checklist = data.Checklist || data.checklist_cecrl || data.checklist || [];

                // Si la checklist no es un array, intentar normalizarla aquí también como fallback
                if (!Array.isArray(checklist) && typeof checklist === 'object' && checklist !== null) {
                    checklist = Object.keys(checklist).map(key => ({
                        competence: key.replace(/_/g, ' ').toUpperCase(),
                        items: checklist[key]
                    }));
                }

                if (checklist.length === 0) {
                    area.innerHTML += `<p style="color:#888;">No hay objetivos registrados para este nivel.</p>`;
                } else {
                    checklist.forEach(i => {
                        const items = i.items || i.descripteurs_b1 || i.descripteurs_a1 || i.descripteurs_a2 || i.descripteurs_b2 || i.descripteurs_c1 || [];
                        area.innerHTML += `
                            <div style="padding:15px; border-bottom:1px solid #eee;">
                                <strong>${i.tema || i.competence || "Objetivo"}</strong>
                                <ul style="margin:5px 0 0 0; padding-left:20px; font-size:0.85rem; color:#666;">
                                    ${Array.isArray(items) ? items.map(it => `<li>${it}</li>`).join('') : `<li>${items}</li>`}
                                </ul>
                            </div>`;
                    });
                }
            }
        };

       window.filterUnits = async (val, skill) => {
            const container = document.getElementById('units-container');
            container.innerHTML = "";
            const snap = await getDoc(doc(db, "BibliotecaEjercicios", currentLevel));
            
            if (!snap.exists()) {
                container.innerHTML = `<p style="color:#888;">No hay datos para el nivel ${currentLevel}.</p>`;
                return;
            }

            const data = snap.data();
            const itinerario = data.itinerario || data.itinerario_completo || [];

            itinerario.forEach(u => {
                const uNum = (u.unidad || u.unite || "").toString();
                // Filtro por unidad (si no es 'all')
                if(val !== 'all' && !uNum.includes(val)) return;

                // Extraemos solo los ejercicios que coinciden con la habilidad seleccionada (CO, CE, PE, PO)
                const ejercicios = (u.ejercicios || []).filter(e => e.habilidad === skill);

                if(ejercicios && ejercicios.length > 0) {
                    let htmlContenido = `<div class="unit-box">
                        <strong style="color: var(--oxford); font-size: 1.1rem;">${u.unidad}:</strong> ${u.tema || ''}
                        <div style="margin-top: 15px;">`;

                    ejercicios.forEach(ej => {
                        htmlContenido += `
                        <div style="background: white; border-left: 4px solid var(--gold); padding: 20px; margin-bottom: 15px; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.05);">
                            <h4 style="margin-top: 0; color: var(--oxford);">${ej.instruccion || 'Exercice'}</h4>`;

                        // Si hay texto de lectura (Ej. Comprensión Escrita)
                        if (ej.texto_lectura) {
                            htmlContenido += `<div style="background: var(--cream); padding: 15px; border-radius: 5px; font-style: italic; margin-bottom: 15px; line-height: 1.6;">${ej.texto_lectura}</div>`;
                        }

                        // Renderizado dinámico según el tipo de ejercicio dictado por Sophia
                        if (ej.tipo === 'opcion_multiple' && ej.preguntas) {
                            ej.preguntas.forEach((p, index) => {
                                htmlContenido += `<div style="margin-bottom: 15px;">
                                    <p><strong>${index + 1}. ${p.pregunta}</strong></p>`;
                                p.opciones.forEach(opcion => {
                                    htmlContenido += `
                                    <label style="display: block; margin-bottom: 8px; cursor: pointer;">
                                        <input type="radio" name="pregunta_${index}" value="${opcion}"> ${opcion}
                                    </label>`;
                                });
                                htmlContenido += `</div>`;
                            });

                        } else if (ej.tipo === 'redaccion') {
                            // Caja de texto para Producción Escrita
                            htmlContenido += `
                            <textarea placeholder="Écrivez votre réponse ici..." style="width: 100%; height: 150px; padding: 15px; border: 1px solid #ccc; border-radius: 5px; font-family: 'Montserrat', sans-serif; resize: vertical;"></textarea>
                            <button style="margin-top: 10px; background: var(--oxford); color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer;">Soumettre (Évaluation IA)</button>`;

                        } else if (ej.tipo === 'interaccion_tiempo_real') {
                            // Interfaz de Jurado para Producción Oral
                            htmlContenido += `
                            <div style="background: #eef2f5; border: 1px solid #c2d1d9; padding: 15px; border-radius: 5px; text-align: center;">
                                <p style="color: var(--oxford); font-weight: bold;"><i class="fas fa-microphone" style="color: var(--green);"></i> Mode Jury Actif</p>
                                <p style="font-size: 0.9rem; margin-bottom: 15px;">El examinador IA está listo para interactuar.</p>
                                <button style="background: var(--green); color: white; border: none; padding: 12px 25px; border-radius: 5px; cursor: pointer; font-weight: bold;"><i class="fas fa-play"></i> Démarrer l'interaction</button>
                            </div>`;
                        }

                        htmlContenido += `</div>`;
                    });

                    htmlContenido += `</div></div>`;
                    container.innerHTML += htmlContenido;
                }
            });

            if(container.children.length === 0) {
                container.innerHTML = `<p style="color:#888; text-align: center; padding: 20px;">Aucun exercice de ${skill} disponible pour cette sélection.</p>`;
            }
        };
