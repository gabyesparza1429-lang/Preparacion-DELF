<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Objectif Réussite DELF</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #f4f7f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            text-align: center;
            width: 400px;
            padding: 50px;
            background: white;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            border-radius: 20px;
        }
        .logo {
            width: 280px; /* Tamaño aumentado */
            height: auto;
            margin-bottom: 25px;
        }
        h2 {
            color: #002147;
            font-weight: 600;
            margin-bottom: 30px;
        }
        input {
            width: 100%;
            padding: 14px;
            margin: 12px 0;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #002147;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 16px;
            transition: 0.3s;
            margin-top: 10px;
        }
        button:hover {
            background-color: #003366;
            transform: translateY(-2px);
        }
        .slogan {
            font-size: 0.85em;
            color: #888;
            margin-top: 25px;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="login-container">
    <img src="assets/Logo.png" alt="Logo Objectif Réussite" class="logo">
    
    <h2>Bienvenue</h2>
    
    <form id="loginForm">
        <input type="email" placeholder="Email" required>
        <input type="password" placeholder="Mot de passe" required>
        <button type="submit">Entrer</button>
    </form>

    <p class="slogan">De la intención a la certificación</p>
</div>

</body>
</html>
