<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accès | Objectif Réussite</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #f4f7f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-container { text-align: center; width: 350px; padding: 40px; background: white; box-shadow: 0 15px 35px rgba(0,0,0,0.1); border-radius: 20px; }
        .logo { width: 200px; height: auto; margin-bottom: 20px; }
        h2 { color: #002147; font-weight: 600; margin-bottom: 10px; }
        .level-tag { display: inline-block; background: #C5A059; color: white; padding: 5px 15px; border-radius: 20px; font-size: 0.8rem; margin-bottom: 25px; }
        input { width: 100%; padding: 14px; margin: 10px 0; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; }
        button { width: 100%; padding: 14px; background-color: #002147; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: 600; transition: 0.3s; }
        button:hover { background-color: #003366; }
        #error-msg { color: red; font-size: 0.8rem; margin-top: 10px; display: none; }
    </style>
</head>
<body>

<div class="login-container">
    <img src="/assets/Banner.png" alt="Logo Objectif Réussite" class="logo">
    <h2 id="title">Bienvenue</h2>
    <div id="level-indicator" class="level-tag">Niveau --</div>
    
    <div id="loginForm">
        <input type="text" id="student_id" placeholder="ID de acceso (generado por admin)">
        <button onclick="login()">Entrer</button>
        <p id="error-msg">ID no encontrado para este nivel.</p>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js";
    import { firebaseConfig } from "./js/firebase-config.js";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const rawLevel = new URLSearchParams(window.location.search).get('level') || "B1";
    const level = rawLevel.toUpperCase().trim();
    document.getElementById('level-indicator').innerText = "Niveau " + level;

    window.login = async () => {
        const id = document.getElementById('student_id').value.toLowerCase().trim();
        const err = document.getElementById('error-msg');
        err.style.display = "none";

        if(!id) return;

        const snap = await getDoc(doc(db, "Usuarios", id));
        if(snap.exists()){
            const d = snap.data();
            if(d.nivel === level) {
                window.location.href = `alumno.html?id=${id}`;
            } else {
                err.innerText = `Este ID pertenece al nivel ${d.nivel}. Vuelve atrás.`;
                err.style.display = "block";
            }
        } else {
            err.innerText = "ID de acceso no válido.";
            err.style.display = "block";
        }
    };
</script>

</body>
</html>
