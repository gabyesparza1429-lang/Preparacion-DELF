<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Espace | Objectif Réussite</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --oxford-blue: #002147;
            --gold: #C5A059;
            --bg-gray: #f4f7f9;
            --white: #ffffff;
            --green: #2a9d8f;
        }
        body { font-family: 'Montserrat', sans-serif; margin: 0; background-color: var(--bg-gray); color: var(--oxford-blue); }

        /* Header con Marca */
        .header {
            background: var(--oxford-blue);
            color: white;
            padding: 20px 40px 120px 40px;
            border-bottom: 5px solid var(--gold);
            position: relative;
        }
        .top-nav { display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 20px; }
        .brand-logo { width: 220px; height: auto; }
        .logout-btn { background: rgba(255, 255, 255, 0.1); color: white; border: 1px solid var(--gold); padding: 8px 18px; border-radius: 20px; cursor: pointer; font-weight: 600; transition: 0.3s; text-decoration: none; font-size: 0.8rem; }
        .logout-btn:hover { background: var(--gold); color: var(--oxford-blue); }

        .welcome-section { text-align: center; }
        .welcome-section h1 { margin: 10px 0 0 0; font-size: 2.5rem; }

        .container { max-width: 1100px; margin: -80px auto 50px auto; padding: 0 20px; position: relative; z-index: 10; }

        /* Dashboard */
        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; margin-bottom: 30px; }
        .card-dash { background: var(--white); padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; }
        .countdown-val { font-size: 3rem; font-weight: 800; color: var(--gold); margin: 10px 0; }
        
        .progress-bar-bg { width: 100%; background: #edf2f7; border-radius: 15px; height: 15px; margin: 20px 0 10px 0; overflow: hidden; }
        .progress-bar-fill { background: var(--green); height: 100%; width: 0%; transition: width 1.5s ease; }

        /* Sophia Box */
        .sophia-box {
            background: var(--white); padding: 30px; border-radius: 20px; margin-bottom: 30px; border-left: 8px solid var(--gold);
            display: flex; align-items: center; gap: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        /* Skills Grid mejorada para múltiples botones */
        .skills-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .skill-item { background: var(--white); padding: 25px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.03); display: flex; flex-direction: column; }
        .skill-icon { font-size: 2rem; margin-bottom: 10px; display: block; text-align: center; }
        .skill-title { font-weight: 700; text-align: center; margin-bottom: 15px; display: block; }
        
        .btn-group { display: flex; flex-direction: column; gap: 8px; }
        .btn-link {
            padding: 10px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 0.75rem;
            text-align: center; transition: 0.3s; border: 1px solid var(--oxford-blue);
        }
        .btn-q { background: var(--oxford-blue); color: white; }
        .btn-t { background: white; color: var(--oxford-blue); }
        .btn-c { background: var(--gold); color: white; border-color: var(--gold); }
        .btn-link:hover { opacity: 0.8; transform: scale(1.02); }

        .footer { text-align: center; padding: 50px; color: #999; font-size: 0.8rem; }
    </style>
</head>
<body>

    <header class="header">
        <div class="top-nav">
            <img src="../../assets/Logo.png" alt="Logo" class="brand-logo">
            <button class="logout-btn" onclick="logout()">Déconnexion ✕</button>
        </div>
        <div class="welcome-section">
            <p id="levelDisplay" style="letter-spacing: 3px; opacity: 0.8;">NIVEAU ...</p>
            <h1 id="studentWelcome">Bonjour !</h1>
        </div>
    </header>

    <div class="container">
        <div class="dashboard-grid">
            <div class="card-dash">
                <span style="font-size: 0.75rem; font-weight: 700; color: #999;">JOURS AVANT L'EXAMEN</span>
                <div id="daysLeft" class="countdown-val">--</div>
            </div>
            <div class="card-dash">
                <span style="font-size: 0.75rem; font-weight: 700; color: #999;">TON PROGRÈS</span>
                <div class="progress-bar-bg"><div class="progress-bar-fill" id="pBar"></div></div>
                <span id="pPercent" style="font-weight: 700; color: var(--green);">0%</span>
            </div>
        </div>

        <div class="sophia-box">
            <div style="font-size: 3rem;">✨</div>
            <div>
                <h4 style="margin: 0; color: var(--gold); text-transform: uppercase; font-size: 0.8rem;">Sophia - Ton assistante IA</h4>
                <p id="feedbackMsg" style="font-style: italic; color: #555; margin-top: 5px;">"Bonjour ! Travaille tes compétences ci-dessous."</p>
            </div>
        </div>

        <div class="skills-container">
            <div id="skill-ORAL" class="skill-item"></div>
            <div id="skill-ECRIT" class="skill-item"></div>
            <div id="skill-PE" class="skill-item"></div>
            <div id="skill-PO" class="skill-item"></div>
        </div>
    </div>

    <footer class="footer">&copy; 2026 Objectif Réussite DELF - Gaby Esparza</footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCgog8tKspHy01ZHE8Dthl9O4W6lw1a_Ec",
            authDomain: "objectif-reussite-delf.firebaseapp.com",
            projectId: "objectif-reussite-delf",
            storageBucket: "objectif-reussite-delf.firebasestorage.app",
            messagingSenderId: "942279633770",
            appId: "1:942279633770:web:9d7b5fe54d0139019c1313"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const userName = sessionStorage.getItem('userName');
        const userLevel = sessionStorage.getItem('userLevel');

        if(!userName) { window.location.href = "../../index.html"; }

        document.getElementById('studentWelcome').innerText = `Bonjour, ${userName} !`;
        document.getElementById('levelDisplay').innerText = `NIVEAU ${userLevel}`;

        window.logout = () => { sessionStorage.clear(); window.location.href = "../../index.html"; };

        async function init() {
            const userSnap = await getDoc(doc(db, "Usuarios", userName));
            if(userSnap.exists()){
                const d = userSnap.data();
                document.getElementById('feedbackMsg').innerText = d.mensaje_sophia || "Bon courage !";
                const prog = d.progreso || 0;
                document.getElementById('pBar').style.width = prog + "%";
                document.getElementById('pPercent').innerText = prog + "%";
                
                // Cálculo de días (si tienes la fecha)
                if(d.fecha_certificacion) {
                    const diff = new Date(d.fecha_certificacion) - new Date();
                    document.getElementById('daysLeft').innerText = Math.max(0, Math.ceil(diff / (1000 * 60 * 60 * 24)));
                }
            }

            const habilidades = [
                {id:'ORAL', icon:'🎧', label:'Compréhension Orale'},
                {id:'ECRIT', icon:'📖', label:'Compréhension Écrite'},
                {id:'PE', icon:'✍️', label:'Production Écrite'},
                {id:'PO', icon:'🗣️', label:'Production Orale'}
            ];

            for (const h of habilidades) {
                const matSnap = await getDoc(doc(db, `Material_${userLevel}`, h.id));
                const container = document.getElementById(`skill-${h.id}`);
                
                if(matSnap.exists()){
                    const m = matSnap.data();
                    container.innerHTML = `
                        <span class="skill-icon">${h.icon}</span>
                        <strong class="skill-title">${h.label}</strong>
                        <p style="font-size:0.8rem; color:#888; text-align:center;">${m.titulo}</p>
                        <div class="btn-group">
                            ${m.url_q ? `<a href="${m.url_q}" target="_blank" class="btn-link btn-q">QUESTIONS</a>` : ''}
                            ${m.url_t ? `<a href="${m.url_t}" target="_blank" class="btn-link btn-t">TRANSCRIPTION</a>` : ''}
                            ${m.url_c ? `<a href="${m.url_c}" target="_blank" class="btn-link btn-c">CORRIGÉS</a>` : ''}
                        </div>
                    `;
                } else {
                    container.innerHTML = `<span class="skill-icon">${h.icon}</span><strong>${h.label}</strong><p>Bientôt disponible</p>`;
                }
            }
        }
        init();
    </script>
</body>
</html>
