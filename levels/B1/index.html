<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Niveau B1 | Objectif Réussite</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background: #f4f7f9; padding: 40px; color: #333; }
        .container { max-width: 800px; margin: auto; }
        h1 { color: #002147; text-align: center; border-bottom: 3px solid #C5A059; padding-bottom: 10px; }
        .card { background: white; padding: 25px; margin-bottom: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-left: 5px solid #002147; }
        .card h3 { margin-top: 0; color: #002147; }
        .btn { background: #C5A059; color: white; padding: 12px 25px; text-decoration: none; border-radius: 6px; display: inline-block; font-weight: bold; transition: 0.3s; }
        .btn:hover { background: #002147; }
        .tag { background: #e0e0e0; padding: 4px 10px; border-radius: 4px; font-size: 0.8rem; text-transform: uppercase; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Matériel de Préparation B1</h1>
        <div id="lista-materiales">
            <p>Chargement du matériel en cours...</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCgog8tKspHy01ZHE8Dthl9O4W6lw1a_Ec",
            authDomain: "objectif-reussite-delf.firebaseapp.com",
            projectId: "objectif-reussite-delf",
            storageBucket: "objectif-reussite-delf.firebasestorage.app",
            messagingSenderId: "942279633770",
            appId: "1:942279633770:web:9d7b5fe54d0139019c1313"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function cargarMaterial() {
            const querySnapshot = await getDocs(collection(db, "Material_B1"));
            const contenedor = document.getElementById("lista-materiales");
            contenedor.innerHTML = "";

            if (querySnapshot.empty) {
                contenedor.innerHTML = "<p>Aucun matériel disponible pour le moment.</p>";
                return;
            }

            querySnapshot.forEach((doc) => {
                const data = doc.data();
                contenedor.innerHTML += `
                    <div class="card">
                        <span class="tag">${data.tipo}</span>
                        <h3>${data.titulo}</h3>
                        <a href="${data.url}" class="btn" target="_blank">Ouvrir le fichier</a>
                    </div>
                `;
            });
        }
        cargarMaterial();
    </script>
</body>
</html>
