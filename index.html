<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>NeuroRéussit | Bienvenue</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --oxford: #002147; --gold: #C5A059; --white: #ffffff; }
        body { font-family: 'Montserrat', sans-serif; margin: 0; background: #f4f7f9; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; color: var(--oxford); }
        .header { text-align: center; margin-bottom: 50px; }
        .container { display: flex; gap: 30px; justify-content: center; padding: 20px; }
        .card { background: var(--white); width: 280px; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center; text-decoration: none; color: inherit; transition: 0.3s; border: 2px solid transparent; }
        .card:hover { transform: translateY(-10px); border-color: var(--gold); }
        .btn { background: var(--oxford); color: white; padding: 10px 20px; border-radius: 8px; font-weight: bold; margin-top: 15px; display: inline-block; }
    </style>
</head>
<body>
    <div class="header">
        <h1>NeuroRéussit</h1>
        <p style="color: var(--gold); font-weight: bold;">ACCESSIBILITÉ ÉDUCATIVE</p>
    </div>
    <div class="container">
        <a href="alumno.html" class="card">
            <div style="font-size: 3rem;">🎓</div>
            <h2>Réussite DELF</h2>
            <p>Preparación especializada para exámenes.</p>
            <div class="btn">Entrar</div>
        </a>
        <div class="card" style="opacity: 0.6; cursor: not-allowed;">
            <div style="font-size: 3rem;">🚀</div>
            <h2>Próximo Proyecto</h2>
            <p>Nueva herramienta en diseño.</p>
            <div class="btn" style="background: #ccc;">Próximamente</div>
        </div>
    </div>
</body>
</html>
