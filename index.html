<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Neuroreussit - Inicio</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --oxford: #002147; --gold: #C5A059; --white: #ffffff; }
        body { font-family: 'Montserrat', sans-serif; margin: 0; background: #2f3640; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; color: var(--white); position: relative; }
        .header { text-align: center; margin-bottom: 40px; }
        .header h1 { color: var(--white); }
        .container { display: flex; gap: 30px; justify-content: center; padding: 20px; }
        .card { background: var(--white); width: 320px; padding: 35px 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); text-align: center; text-decoration: none; color: var(--oxford); transition: 0.3s; border: 2px solid transparent; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: space-between; min-height: 420px; }
        .card:hover { transform: translateY(-10px); border-color: var(--gold); }
        .btn { background: var(--oxford); color: white; padding: 12px 20px; border-radius: 8px; font-weight: bold; margin-top: 15px; display: inline-block; width: 85%; text-align: center; border: none; }
        
        /* LOGOS GRANDES Y VISIBLES */
        .logo-proyecto { width: 220px; height: 140px; object-fit: contain; margin-bottom: 10px; }
        
        /* BOTÓN DE ACCESO INVISIBLE PARA ADMINISTRADOR */
        .admin-secret-link { position: absolute; top: 0; left: 0; width: 60px; height: 60px; background: transparent; cursor: default; text-decoration: none; z-index: 999; }
    </style>
</head>
<body>

    <!-- Acceso secreto invisible arriba a la izquierda -->
    <a href="admin.html" class="admin-secret-link" title="Connexion"></a>

    <div class="header">
        <h1>NeuroRéussit</h1>
        <p style="color: var(--gold); font-weight: bold;">ACCESSIBILITÉ ÉDUCATIVE</p>
    </div>

    <div class="container">
        <!-- PROYECTO 1: REUSSITE DELF -->
        <a href="levels.html" class="card">
            <div style="display: flex; flex-direction: column; align-items: center;">
                <img src="./assets/Logo.png" alt="Logo Réussite DELF" class="logo-proyecto">
                <h2 style="margin: 10px 0 5px 0;">Réussite DELF</h2>
                <p style="margin: 5px 0; font-size: 0.95rem;">Preparación especializada para exámenes.</p>
            </div>
            <div class="btn">Entrar</div>
        </a>

        <!-- PROYECTO 2: NEUROCLARITY -->
        <a href="neuroclarity.html" class="card">
            <div style="display: flex; flex-direction: column; align-items: center;">
                <img src="./assets/NeuroClarity.png" alt="Logo NeuroClarity" class="logo-proyecto">
                <h2 style="margin: 10px 0 5px 0;">NeuroClarity</h2>
                <p style="margin: 5px 0; font-size: 0.95rem;">Ingeniería pedagógica para mentes diversas.</p>
            </div>
            <div class="btn" style="background: #B099CE;">Entrar</div>
        </a>
    </div>

</body>
</html>
