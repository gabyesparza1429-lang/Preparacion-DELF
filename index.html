<style>
    /* Estilos para la Ventana Modal Personalizada */
    .modal-overlay {
        display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 33, 71, 0.85); z-index: 2000; justify-content: center; align-items: center;
    }
    .modal-box {
        background: white; padding: 40px; border-radius: 20px; width: 350px; text-align: center;
        box-shadow: 0 15px 35px rgba(0,0,0,0.3); position: relative;
    }
    .modal-logo { width: 80px; margin-bottom: 20px; }
    .modal-box h3 { color: var(--oxford-blue); margin-top: 0; font-size: 1.4rem; }
    .modal-box input {
        width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box;
    }
    .btn-modal {
        background: var(--gold); color: white; border: none; padding: 12px 25px;
        border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px;
    }
    .btn-cancel { background: transparent; color: #999; border: none; margin-top: 15px; cursor: pointer; font-size: 0.8rem; }
</style>

<body>
    <div class="modal-overlay" id="modalAcceso">
        <div class="modal-box">
            <img src="assets/Logo.png" alt="Logo" class="modal-logo">
            <h3 id="modalTitle">Accès Niveau ...</h3>
            <input type="text" id="inputNombre" placeholder="Nom de l'étudiant">
            <input type="password" id="inputPass" placeholder="Mot de passe (PIN)">
            <button class="btn-modal" id="btnValidar">ACCÉDER</button>
            <button class="btn-cancel" onclick="cerrarModal()">Annuler</button>
        </div>
    </div>

    <script type="module">
        // ... (Tu configuración de Firebase de siempre)

        let nivelDestino = "";

        // Abrir la ventana personalizada en lugar del prompt genérico
        window.solicitarAcceso = (nivel) => {
            nivelDestino = nivel;
            document.getElementById('modalTitle').innerText = `Accès Niveau ${nivel}`;
            document.getElementById('modalAcceso').style.display = 'flex';
        };

        window.cerrarModal = () => {
            document.getElementById('modalAcceso').style.display = 'none';
        };

        document.getElementById('btnValidar').onclick = async () => {
            const nombre = document.getElementById('inputNombre').value;
            const clave = document.getElementById('inputPass').value;

            if (!nombre || !clave) return alert("Remplissez tous los campos.");

            // Lógica de Firebase (usando la misma que ya teníamos)
            const docRef = doc(db, "Usuarios", nombre);
            const docSnap = await getDoc(docRef);

            if (docSnap.exists()) {
                const datos = docSnap.data();
                if (datos.password === clave && datos.nivel === nivelDestino) {
                    sessionStorage.setItem('userLevel', datos.nivel);
                    window.location.href = `levels/${nivelDestino}/index.html`;
                } else {
                    alert("Informations incorrectes ou niveau non autorisé.");
                }
            } else {
                alert("Utilisateur non trouvé.");
            }
        };
    </script>
</body>
