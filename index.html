<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Objectif Réussite DELF | Accueil</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --oxford-blue: #002147;
            --gold: #C5A059;
            --light-gray: #f4f7f9;
        }
        body {
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            background-color: var(--light-gray);
            color: #333;
        }

        /* Barra Superior */
        .topbar {
            background: var(--oxford-blue);
            color: white;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Banner */
        .hero {
            width: 100%;
            max-height: 300px;
            overflow: hidden;
        }
        .hero img {
            width: 100%;
            object-fit: cover;
        }

        /* Eslogan */
        .slogan-section {
            text-align: center;
            padding: 40px 20px;
            background: white;
        }
        .slogan-section h1 {
            color: var(--oxford-blue);
            font-size: 2rem;
            margin: 0;
        }

        /* Contenedor de Niveles */
        .levels-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            padding: 40px;
            max-width: 1100px;
            margin: 0 auto;
        }

        /* Tarjeta de Nivel (Tus cuadros favoritos) */
        .level-card {
            background: white;
            padding: 35px 20px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-top: 6px solid var(--gold);
            text-decoration: none;
            color: inherit;
        }

        .level-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 12px 20px rgba(0,0,0,0.1);
            background-color: #fffdf9;
        }

        .level-card h2 {
            font-size: 2.5rem;
            margin: 0;
            color: var(--oxford-blue);
        }

        .level-card p {
            margin: 10px 0 0;
            font-weight: 500;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Estilo especial para C1 */
        .level-card.c1 {
            border-top-color: var(--oxford-blue);
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #999;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <header class="topbar">
        <div class="brand" style="font-weight: 700;">OBJECTIF RÉUSSITE DELF</div>
        <div style="font-size: 0.8rem; opacity: 0.8;">ESPACE ÉTUDIANT</div>
    </header>

    <section class="hero">
        <img src="assets/Banner.png" alt="Banner">
    </section>

    <section class="slogan-section">
        <h1>De la intención a la certificación</h1>
    </section>

    <section class="levels-container">
        <div class="level-card" onclick="solicitarAcceso('A1')">
            <h2>A1</h2>
            <p>Découverte</p>
        </div>
        <div class="level-card" onclick="solicitarAcceso('A2')">
            <h2>A2</h2>
            <p>Survie</p>
        </div>
        <div class="level-card" onclick="solicitarAcceso('B1')">
            <h2>B1</h2>
            <p>Seuil</p>
        </div>
        <div class="level-card" onclick="solicitarAcceso('B2')">
            <h2>B2</h2>
            <p>Indépendant</p>
        </div>
        <div class="level-card c1" onclick="solicitarAcceso('C1')">
            <h2>C1</h2>
            <p>Autonome</p>
        </div>
    </section>

    <footer>
        &copy; 2025 Objectif Réussite DELF - Prof. Elena Gabriela Esparza
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCgog8tKspHy01ZHE8Dthl9O4W6lw1a_Ec",
            authDomain: "objectif-reussite-delf.firebaseapp.com",
            projectId: "objectif-reussite-delf",
            storageBucket: "objectif-reussite-delf.firebasestorage.app",
            messagingSenderId: "942279633770",
            appId: "1:942279633770:web:9d7b5fe54d0139019c1313"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Función que salta al hacer clic en un cuadro
        window.solicitarAcceso = async (nivelSeleccionado) => {
            const nombre = prompt("Nom de l'étudiant :");
            if (!nombre) return;

            const clave = prompt("Mot de passe (PIN) :");
            if (!clave) return;

            try {
                const docRef = doc(db, "Usuarios", nombre);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const datos = docSnap.data();
                    
                    // Comprobar contraseña y nivel asignado
                    if (datos.password === clave) {
                        if (datos.nivel === nivelSeleccionado) {
                            // Éxito: Guardamos sesión y entramos
                            sessionStorage.setItem('userLevel', datos.nivel);
                            sessionStorage.setItem('userName', nombre);
                            window.location.href = `levels/${nivelSeleccionado}/index.html`;
                        } else {
                            // Contraseña bien, pero nivel mal
                            alert(`Accès refusé. Vous êtes inscrit au niveau ${datos.nivel}.`);
                        }
                    } else {
                        alert("Mot de passe incorrect.");
                    }
                } else {
                    alert("Étudiant non trouvé.");
                }
            } catch (error) {
                console.error(error);
                alert("Erreur de connexion.");
            }
        };
    </script>
</body>
</html>
