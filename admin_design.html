<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration | Objectif Réussite DELF</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --oxford-blue: #002147;
            --gold: #C5A059;
            --light-gray: #f4f7f9;
            --white: #ffffff;
            --border: #e0e6ed;
        }
        body {
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--light-gray);
            display: flex;
            height: 100vh;
            color: #333;
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            background-color: var(--oxford-blue);
            color: var(--white);
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
        }
        .sidebar-header {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .sidebar-header h2 { margin: 0; font-size: 1.2rem; color: var(--gold); }
        .sidebar-header p { margin: 5px 0 0 0; font-size: 0.8rem; opacity: 0.7; }
        .menu { list-style: none; padding: 0; margin: 20px 0; }
        .menu li { padding: 15px 20px; cursor: pointer; transition: background 0.3s; border-left: 4px solid transparent; }
        .menu li:hover, .menu li.active { background-color: rgba(255,255,255,0.1); border-left: 4px solid var(--gold); }
        .menu li a { color: var(--white); text-decoration: none; font-weight: 500; display: block; }

        /* Main Workspace */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        .top-navbar {
            background-color: var(--white);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .top-navbar h1 { margin: 0; font-size: 1.5rem; color: var(--oxford-blue); }

        /* Editor Area */
        .editor-container { padding: 40px; max-width: 1000px; margin: 0 auto; width: 100%; box-sizing: border-box; }
        
        .section-box {
            background: var(--white);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            margin-bottom: 30px;
        }
        .section-box h3 {
            color: var(--oxford-blue);
            margin-top: 0;
            border-bottom: 2px solid var(--light-gray);
            padding-bottom: 10px;
        }

        /* Form Elements */
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 8px; color: var(--oxford-blue); }
        input[type="file"].standard-file {
            width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px;
        }

        /* Drag & Drop Zone */
        .drop-zone {
            width: 100%;
            height: 150px;
            border: 2px dashed var(--oxford-blue);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            background-color: #f9fbfe;
            cursor: pointer;
            transition: background 0.3s;
            position: relative;
        }
        .drop-zone:hover, .drop-zone.dragover { background-color: #eef3fa; }
        .drop-zone p { margin: 0; font-weight: 500; color: var(--oxford-blue); }
        .drop-zone span { font-size: 0.8rem; color: #666; margin-top: 5px; }
        .drop-zone input[type="file"] {
            position: absolute; width: 100%; height: 100%; opacity: 0; cursor: pointer;
        }

        /* Track Assigner List */
        .track-list { margin-top: 20px; }
        .track-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 15px; background: var(--light-gray);
            border-radius: 6px; margin-bottom: 10px; border: 1px solid var(--border);
        }
        .track-name { font-weight: 500; font-size: 0.9rem; }
        .track-assign select {
            padding: 6px; border-radius: 4px; border: 1px solid var(--border); font-family: inherit;
        }

        .btn-save {
            background-color: var(--gold); color: var(--oxford-blue);
            padding: 12px 25px; border: none; border-radius: 8px;
            font-weight: 700; font-size: 1rem; cursor: pointer;
            transition: background 0.3s; width: 100%; margin-top: 10px;
        }
        .btn-save:hover { background-color: #b08d4a; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <h2>Gaby1429</h2>
            <p>Espace Administrateur</p>
        </div>
        <ul class="menu">
            <li class="active"><a href="#">Contenu: B1</a></li>
            <li><a href="#">Base de Données</a></li>
        </ul>
    </div>

    <div class="main-content">
        <div class="top-navbar">
            <h1>Configuration : Compréhension de l'Oral (B1)</h1>
        </div>

        <div class="editor-container">
            
            <div class="section-box">
                <h3>1. Chargez le livret (PDF)</h3>
                <div class="form-group">
                    <label>Fichier PDF (Ex: Pages 9 à 40)</label>
                    <input type="file" accept=".pdf" class="standard-file">
                </div>
            </div>

            <div class="section-box">
                <h3>2. Chargez les pistes audio</h3>
                <div class="drop-zone" id="dropZone">
                    <p>Faites glisser les fichiers MP3 ici</p>
                    <span>ou cliquez pour parcourir (DELFB1PISTE01.mp3, etc.)</span>
                    <input type="file" id="audioFiles" accept="audio/mp3" multiple>
                </div>

                <div class="track-list" id="trackList">
                    </div>
            </div>

            <button class="btn-save">Enregistrer la section Oral</button>
        </div>
    </div>

    <script>
        const audioInput = document.getElementById('audioFiles');
        const trackList = document.getElementById('trackList');
        const dropZone = document.getElementById('dropZone');

        // Visual feedback for drag and drop
        audioInput.addEventListener('dragenter', () => dropZone.classList.add('dragover'));
        audioInput.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        audioInput.addEventListener('drop', () => dropZone.classList.remove('dragover'));

        // Handle file selection
        audioInput.addEventListener('change', function() {
            trackList.innerHTML = ''; // Clear previous list
            const files = Array.from(this.files);
            
            if (files.length > 0) {
                // Sort files alphabetically
                files.sort((a, b) => a.name.localeCompare(b.name));

                files.forEach(file => {
                    const item = document.createElement('div');
                    item.className = 'track-item';
                    
                    item.innerHTML = `
                        <div class="track-name">🎵 ${file.name}</div>
                        <div class="track-assign">
                            <select>
                                <option value="">-- Assigner à un exercice --</option>
                                <option value="prep1">Préparation - Ex 1</option>
                                <option value="prep2">Préparation - Ex 2</option>
                                <option value="ent1">Entraînement - Ex 1</option>
                                <option value="ent2">Entraînement - Ex 2</option>
                                <option value="exam1">Examen Blanc - Ex 1</option>
                            </select>
                        </div>
                    `;
                    trackList.appendChild(item);
                });
            }
        });
    </script>
</body>
</html>
