<!-- Admin Panel: Objectif Réussite DELF -->

            <div class="upload-group">
                <label>Audios (Pistas 01-33):</label>

        </div>

                <label>PDF (Págs. 105-138):</label>

            </div>
            <div class="upload-group">
                <label>Audios adicionales:</label>
                <div class="drop-zone-mini">
                    <input type="file" multiple accept="audio/mp3">
                    <p>Arrastrar MP3 aquí</p>
                </div>
            </div>
        </div>
    </div>

    <button class="save-all-btn">Enregistrer tout le niveau</button>
</div>
