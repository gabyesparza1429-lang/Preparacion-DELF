<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Panel Admin | Objectif Réussite</title>
    <style>
        body { font-family: 'Montserrat', sans-serif; background: #f4f7f9; padding: 20px; }
        .panel { max-width: 900px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        h1 { color: #002147; text-align: center; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .card { border: 1px solid #ddd; padding: 15px; border-radius: 10px; background: #fafafa; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #002147; }
        input { width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .btn-save { width: 100%; background: #C5A059; color: white; padding: 15px; border: none; border-radius: 10px; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-top: 20px; }
        .btn-save:hover { background: #002147; }
    </style>
</head>
<body>

<div class="panel">
    <h1>Gestion de Contenu - B1</h1>
    <div class="grid">
        <div class="card">
            <h3>Compréhension de l'Oral</h3>
            <label>Titre de l'exercice:</label>
            <input type="text" id="titre_oral" placeholder="Ex: Exercice 1 - Audio">
            <label>Lien Google Drive (Audio):</label>
            <input type="text" id="url_oral" placeholder="Coller le lien ici">
        </div>

        <div class="card">
            <h3>Compréhension des Écrits</h3>
            <label>Titre de l'exercice:</label>
            <input type="text" id="titre_ecrit" placeholder="Ex: Texte de lecture 1">
            <label>Lien Google Drive (PDF):</label>
            <input type="text" id="url_ecrit" placeholder="Coller le lien ici">
        </div>

        <div class="card">
            <h3>Production Écrite</h3>
            <label>Titre:</label>
            <input type="text" id="titre_prod_e" placeholder="Ex: Sujet de rédaction">
            <label>Lien du document:</label>
            <input type="text" id="url_prod_e" placeholder="Coller le lien ici">
        </div>

        <div class="card">
            <h3>Production Orale</h3>
            <label>Titre:</label>
            <input type="text" id="titre_prod_o" placeholder="Ex: Préparation exposé">
            <label>Lien du document:</label>
            <input type="text" id="url_prod_o" placeholder="Coller le lien ici">
        </div>
    </div>

    <button class="btn-save" id="btnGuardar">ENREGISTRER TOUT LE CONTENU</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCgog8tKspHy01ZHE8Dthl9O4W6lw1a_Ec",
        authDomain: "objectif-reussite-delf.firebaseapp.com",
        projectId: "objectif-reussite-delf",
        storageBucket: "objectif-reussite-delf.firebasestorage.app",
        messagingSenderId: "942279633770",
        appId: "1:942279633770:web:9d7b5fe54d0139019c1313"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.getElementById('btnGuardar').addEventListener('click', async () => {
        const materiales = [
            { id: 'oral_1', titulo: document.getElementById('titre_oral').value, url: document.getElementById('url_oral').value, tipo: 'Audio' },
            { id: 'ecrit_1', titulo: document.getElementById('titre_ecrit').value, url: document.getElementById('url_ecrit').value, tipo: 'Lecture' },
            { id: 'prod_e_1', titulo: document.getElementById('titre_prod_e').value, url: document.getElementById('url_prod_e').value, tipo: 'Production Écrite' },
            { id: 'prod_o_1', titulo: document.getElementById('titre_prod_o').value, url: document.getElementById('url_prod_o').value, tipo: 'Production Orale' }
        ];

        try {
            for (const item of materiales) {
                if (item.titulo && item.url) {
                    await setDoc(doc(db, "Material_B1", item.id), item);
                }
            }
            alert("¡Contenido guardado exitosamente en B1!");
        } catch (e) {
            console.error("Error:", e);
            alert("Error al guardar.");
        }
    });
</script>
</body>
</html>
