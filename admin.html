<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Expert | Objectif Réussite</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --oxford-blue: #002147; --gold: #C5A059; --bg: #f4f7f9; }
        body { font-family: 'Montserrat', sans-serif; background: var(--bg); margin: 0; display: flex; }
        
        /* Sidebar lateral para organizar tus secciones */
        .sidebar { width: 250px; background: var(--oxford-blue); height: 100vh; color: white; padding: 20px; position: fixed; }
        .sidebar h2 { font-size: 1.2rem; border-bottom: 1px solid var(--gold); padding-bottom: 10px; }
        .nav-links { list-style: none; padding: 0; margin-top: 30px; }
        .nav-links li { margin: 20px 0; cursor: pointer; opacity: 0.8; transition: 0.3s; }
        .nav-links li:hover { opacity: 1; color: var(--gold); }
        
        .main-content { margin-left: 290px; padding: 40px; width: 100%; }
        .section-card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); margin-bottom: 30px; }
        
        h3 { color: var(--oxford-blue); border-left: 5px solid var(--gold); padding-left: 10px; }
        
        /* Formulario y Tablas */
        .grid-form { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; font-family: inherit; }
        .btn { background: var(--oxford-blue); color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn:hover { background: var(--gold); }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background: #eee; padding: 12px; text-align: left; color: var(--oxford-blue); }
        td { padding: 12px; border-bottom: 1px solid #eee; }
        
        .btn-delete { background: #ff4d4d; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>PORTAIL GABY</h2>
        <ul class="nav-links">
            <li onclick="location.href='#alumnos'">👨‍🎓 Gestion Étudiants</li>
            <li onclick="location.href='#materiales'">📁 Upload Matériel</li>
            <li onclick="location.href='contabilidad.html'">💰 Comptabilité</li>
            <li onclick="location.href='index.html'" style="margin-top: 50px;">⬅ Ver Portal</li>
        </ul>
    </div>

    <div class="main-content">
        
        <div id="alumnos" class="section-card">
            <h3>Enregistrer un nouvel Étudiant</h3>
            <form id="adminForm" class="grid-form">
                <div>
                    <label>Nom :</label>
                    <input type="text" id="nombreAlumno" placeholder="Nom complet" required>
                </div>
                <div>
                    <label>Mot de passe (PIN) :</label>
                    <input type="text" id="passAlumno" placeholder="Ej: 2024" required>
                </div>
                <div style="grid-column: span 2;">
                    <label>Niveau :</label>
                    <select id="nivelAlumno">
                        <option value="A1">A1 - Découverte</option>
                        <option value="A2">A2 - Survie</option>
                        <option value="B1">B1 - Seuil</option>
                        <option value="B2">B2 - Indépendant</option>
                        <option value="C1">C1 - Autonome</option>
                    </select>
                </div>
                <button type="submit" class="btn" style="grid-column: span 2;">SAUVEGARDER</button>
            </form>

            <table>
                <thead>
                    <tr><th>Nom</th><th>Niveau</th><th>PIN</th><th>Action</th></tr>
                </thead>
                <tbody id="listaAlumnos"></tbody>
            </table>
        </div>

        <div id="materiales" class="section-card">
            <h3>📁 Télécharger du matériel aux niveaux</h3>
            <p style="font-size: 0.8rem; color: #666;">Selecciona el nivel y el archivo para subirlo directamente a la carpeta del curso.</p>
            <div class="grid-form">
                <select id="subirNivel">
                    <option value="A1">Dossier A1</option>
                    <option value="A2">Dossier A2</option>
                    <option value="B1">Dossier B1</option>
                    <option value="B2">Dossier B2</option>
                    <option value="C1">Dossier C1</option>
                </select>
                <input type="file" id="archivoMaterial">
                <button class="btn" onclick="subirMaterial()">UPLOADER</button>
            </div>
            <div id="statusUpload" style="margin-top: 10px; font-weight: bold;"></div>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
        import { getFirestore, doc, setDoc, collection, onSnapshot, deleteDoc } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCgog8tKspHy01ZHE8Dthl9O4W6lw1a_Ec",
            authDomain: "objectif-reussite-delf.firebaseapp.com",
            projectId: "objectif-reussite-delf",
            storageBucket: "objectif-reussite-delf.firebasestorage.app",
            messagingSenderId: "942279633770",
            appId: "1:942279633770:web:9d7b5fe54d0139019c1313"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        // --- Lógica Alumnos ---
        document.getElementById('adminForm').onsubmit = async (e) => {
            e.preventDefault();
            const nombre = document.getElementById('nombreAlumno').value;
            const clave = document.getElementById('passAlumno').value;
            const nivel = document.getElementById('nivelAlumno').value;
            await setDoc(doc(db, "Usuarios", nombre), { usuario: nombre, password: clave, nivel: nivel });
            document.getElementById('adminForm').reset();
            alert("Étudiant enregistré!");
        };

        onSnapshot(collection(db, "Usuarios"), (snap) => {
            const tbody = document.getElementById('listaAlumnos');
            tbody.innerHTML = "";
            snap.forEach((doc) => {
                const data = doc.data();
                tbody.innerHTML += `<tr><td>${data.usuario}</td><td><b>${data.nivel}</b></td><td><code>${data.password}</code></td>
                <td><button class="btn-delete" onclick="eliminarAlumno('${data.usuario}')">❌</button></td></tr>`;
            });
        });

        window.eliminarAlumno = async (id) => { if(confirm("Supprimer?")) await deleteDoc(doc(db, "Usuarios", id)); };

        // --- Lógica Materiales ---
        window.subirMaterial = async () => {
            const file = document.getElementById('archivoMaterial').files[0];
            const nivel = document.getElementById('subirNivel').value;
            if(!file) return alert("Select a file");
            
            const storageRef = ref(storage, `materiales/${nivel}/${file.name}`);
            document.getElementById('statusUpload').innerText = "Téléchargement en cours...";
            
            try {
                await uploadBytes(storageRef, file);
                document.getElementById('statusUpload').innerText = "✅ Succès! Le fichier est dans le dossier " + nivel;
            } catch (e) {
                alert("Error upload");
            }
        };
    </script>
</body>
</html>
