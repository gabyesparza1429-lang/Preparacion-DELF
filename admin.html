<div id="alumnos" class="content-page active">
    
    <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 30px;">
        <div class="card">
            <h3>📈 Tendencia de Inscripciones</h3>
            <canvas id="graficaInscripciones" height="100"></canvas>
        </div>
        <div class="card">
            <h3>📊 Alumnos por Nivel</h3>
            <canvas id="graficaNiveles"></canvas>
        </div>
    </div>

    <div class="card">
        <h3>Registrar Nuevo Alumno</h3>
        <form id="formAlumno" class="grid-form">
            <div>
                <label>Nom de l'étudiant :</label>
                <input type="text" id="nom" placeholder="Ej: Sergio A H" required>
            </div>
            <div>
                <label>Téléphone :</label>
                <input type="tel" id="tel" placeholder="442..." required>
            </div>
            <div>
                <label>E-mail :</label>
                <input type="email" id="mail" placeholder="correo@ejemplo.com" required>
            </div>
            <div>
                <label>Niveau :</label>
                <select id="nivel">
                    <option>A1</option><option>A2</option><option>B1</option><option>B2</option><option>C1</option>
                </select>
            </div>
            <div>
                <label>Mot de passe (PIN) :</label>
                <input type="text" id="pin" placeholder="PIN de acceso" required>
            </div>
            <div>
                <label>Fecha de Alta :</label>
                <input type="date" id="fechaAlta" required>
            </div>
            <div class="full-width">
                <label>Fecha prevista de Certificación :</label>
                <input type="text" id="fechaCert" placeholder="Ej: Junio 2026">
            </div>
            <button type="submit" class="btn-save" style="grid-column: span 2;">ENREGISTRER L'ÉTUDIANT</button>
        </form>
    </div>

    <div class="card">
        <h3>Base de Datos de Alumnos</h3>
        <table>
            <thead>
                <tr>
                    <th>Nom</th><th>Niveau</th><th>PIN</th><th>Tel/Mail</th><th>Certif.</th><th>Action</th>
                </tr>
            </thead>
            <tbody id="listaAlumnos"></tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script type="module">
    // ... (Tu configuración de Firebase de antes)

    // Función para dibujar las gráficas
    function actualizarGraficas(alumnos) {
        const nivelesContador = { 'A1': 0, 'A2': 0, 'B1': 0, 'B2': 0, 'C1': 0 };
        const mesesContador = {};

        alumnos.forEach(a => {
            // Contar niveles
            if (nivelesContador[a.nivel] !== undefined) nivelesContador[a.nivel]++;
            
            // Contar por mes (Tendencia)
            const mes = a.fecha_alta ? a.fecha_alta.substring(0, 7) : 'Sin fecha';
            mesesContador[mes] = (mesesContador[mes] || 0) + 1;
        });

        // Gráfica de Línea (Tendencia)
        new Chart(document.getElementById('graficaInscripciones'), {
            type: 'line',
            data: {
                labels: Object.keys(mesesContador).sort(),
                datasets: [{
                    label: 'Nuevos Alumnos',
                    data: Object.values(mesesContador),
                    borderColor: '#C5A059',
                    backgroundColor: 'rgba(197, 160, 89, 0.2)',
                    fill: true,
                    tension: 0.4
                }]
            }
        });

        // Gráfica de Donita (Niveles)
        new Chart(document.getElementById('graficaNiveles'), {
            type: 'doughnut',
            data: {
                labels: Object.keys(nivelesContador),
                datasets: [{
                    data: Object.values(nivelesContador),
                    backgroundColor: ['#002147', '#C5A059', '#1d3557', '#e9c46a', '#2a9d8f']
                }]
            }
        });
    }

    // Al cargar los datos de Firebase, llamamos a la función
    onSnapshot(collection(db, "Usuarios"), (snap) => {
        const alumnos = [];
        const tbody = document.getElementById('listaAlumnos');
        tbody.innerHTML = "";
        
        snap.forEach((doc) => {
            const d = doc.data();
            alumnos.push(d);
            // ... (Código para llenar la tabla que ya teníamos)
        });

        actualizarGraficas(alumnos);
    });
</script>
