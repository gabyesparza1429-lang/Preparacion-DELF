<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Objectif Réussite DELF</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --oxford-blue: #002147;
            --gold: #C5A059;
            --bg-gray: #f4f7f9;
            --white: #ffffff;
            --green: #2ecc71;
            --red: #e74c3c;
        }
        body { font-family: 'Montserrat', sans-serif; margin: 0; background: var(--bg-gray); display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar */
        .sidebar { width: 260px; background: var(--oxford-blue); color: white; display: flex; flex-direction: column; flex-shrink: 0; }
        .sidebar-header { padding: 30px 20px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .sidebar-header strong { font-size: 1.2rem; color: var(--gold); }
        .menu-item { padding: 18px 25px; cursor: pointer; transition: 0.3s; opacity: 0.7; border-left: 4px solid transparent; }
        .menu-item:hover { opacity: 1; background: rgba(255,255,255,0.05); }
        .menu-item.active { opacity: 1; background: rgba(255,255,255,0.1); border-left: 4px solid var(--gold); font-weight: 600; }

        /* Contenido */
        .main-container { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
        .top-bar { background: var(--white); padding: 20px 40px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); z-index: 10; }
        .content-page { padding: 30px; display: none; max-width: 1200px; margin: 0 auto; width: 100%; box-sizing: border-box; }
        .content-page.active { display: block; }

        /* Tarjetas y Estilos */
        .card { background: var(--white); padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 25px; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        label { display: block; margin-top: 15px; margin-bottom: 5px; font-weight: bold; color: var(--oxford-blue); font-size: 0.9rem; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-family: inherit; }
        
        /* Stats */
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { padding: 20px; border-radius: 8px; background: var(--white); border-left: 5px solid var(--gold); box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .stat-value { font-size: 1.8rem; font-weight: 700; color: var(--oxford-blue); }

        /* Tablas */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #eee; font-size: 0.9rem; }
        thead { background: var(--oxford-blue); color: white; }
        .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; background: #d4edda; color: #155724; }

        .btn-save { background: var(--gold); color: white; width: 100%; padding: 18px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; margin-top: 20px; transition: 0.3s; }
        .btn-save:hover { background: var(--oxford-blue); }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header"><strong>Gaby1429</strong><br><small>Objectif Réussite</small></div>
        <div class="menu-item active" onclick="showPage('materiales', this)">Contenu & Matériel</div>
        <div class="menu-item" onclick="showPage('database', this)">Base de Données</div>
    </div>

    <div class="main-container">
        <div class="top-bar"><h2 id="page-title">Configuration du Matériel</h2></div>

        <div id="materiales" class="content-page active">
            <div class="card">
                <label>Niveau DELF:</label>
                <select id="level_selector"><option>A1</option><option>A2</option><option selected>B1</option><option>B2</option></select>
            </div>
            <div class="grid">
                <div class="card"><h3>Oral</h3><input type="text" id="titre_oral" placeholder="Titre"><input type="text" id="url_oral" placeholder="Lien Drive"></div>
                <div class="card"><h3>Écrits</h3><input type="text" id="titre_ecrit" placeholder="Titre"><input type="text" id="url_ecrit" placeholder="Lien Drive"></div>
                <div class="card"><h3>Production Écrite</h3><input type="text" id="titre_prod_e" placeholder="Titre"><input type="text" id="url_prod_e" placeholder="Lien Drive"></div>
                <div class="card"><h3>Production Orale</h3><input type="text" id="titre_prod_o" placeholder="Titre"><input type="text" id="url_prod_o" placeholder="Lien Drive"></div>
            </div>
            <button class="btn-save" id="btnGuardar">ENREGISTRER LE CONTENU</button>
        </div>

        <div id="database" class="content-page">
            <div class="stats-grid">
                <div class="stat-card" style="border-left-color: var(--green);"><small>REVENUS</small><div class="stat-value" id="total_ganado">$ 0</div></div>
                <div class="stat-card"><small>ÉTUDIANTS</small><div class="stat-value" id="total_alumnos">0</div></div>
            </div>
            <div class="card">
                <h3>Inscrire un Élève</h3>
                <div style="display:flex; gap:10px;">
                    <input type="text" id="nom_eleve" placeholder="Nom">
                    <input type="text" id="pago_eleve" placeholder="Prix (MXN)">
                    <button id="btnInscribir" style="background:var(--green); color:white; border:none; padding:10px 20px; border-radius:5px; cursor:pointer;">VALIDER</button>
                </div>
            </div>
            <div class="card" style="padding:0;">
                <table>
                    <thead><tr><th>Étudiant</th><th>Niveau</th><th>Début</th><th>Échéance</th><th>Statut</th></tr></thead>
                    <tbody id="lista_alumnos_body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
        import { getFirestore, doc, setDoc, collection, query, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCgog8tKspHy01ZHE8Dthl9O4W6lw1a_Ec",
            authDomain: "objectif-reussite-delf.firebaseapp.com",
            projectId: "objectif-reussite-delf",
            storageBucket: "objectif-reussite-delf.firebasestorage.app",
            messagingSenderId: "942279633770",
            appId: "1:942279633770:web:9d7b5fe54d0139019c1313"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // NAVEGACIÓN
        window.showPage = (pageId, el) => {
            document.querySelectorAll('.content-page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            el.classList.add('active');
        };

        // GUARDAR MATERIAL
        document.getElementById('btnGuardar').addEventListener('click', async () => {
            const nivel = document.getElementById('level_selector').value;
            const secciones = [
                { id: 'ORAL', t: 'titre_oral', u: 'url_oral' },
                { id: 'ECRIT', t: 'titre_ecrit', u: 'url_ecrit' },
                { id: 'PROD_E', t: 'titre_prod_e', u: 'url_prod_e' },
                { id: 'PROD_O', t: 'titre_prod_o', u: 'url_prod_o' }
            ];
            for (const s of secciones) {
                const titulo = document.getElementById(s.t).value;
                const url = document.getElementById(s.u).value;
                if (titulo && url) {
                    await setDoc(doc(db, `Material_${nivel}`, `${s.id}_${Date.now()}`), { titulo, url, tipo: s.id, date: serverTimestamp() });
                }
            }
            alert("Contenu synchronisé !");
        });

        // INSCRIBIR ALUMNO (90 DÍAS)
        document.getElementById('btnInscribir').addEventListener('click', async () => {
            const nombre = document.getElementById('nom_eleve').value;
            const monto = document.getElementById('pago_eleve').value;
            if (!nombre || !monto) return;

            const inicio = new Date();
            const fin = new Date();
            fin.setDate(inicio.getDate() + 90);

            await setDoc(doc(db, "Usuarios", nombre), {
                usuario: nombre, monto, nivel: "B1",
                fecha_inicio: inicio.toISOString().split('T')[0],
                fecha_vencimiento: fin.toISOString().split('T')[0],
                estado: "ACTIVO"
            });
            alert("Élève inscrit !");
            document.getElementById('nom_eleve').value = ""; document.getElementById('pago_eleve').value = "";
        });

        // ACTUALIZAR TABLA EN TIEMPO REAL
        onSnapshot(query(collection(db, "Usuarios")), (snap) => {
            const body = document.getElementById('lista_alumnos_body');
            let total = 0, count = 0; body.innerHTML = "";
            snap.forEach(d => {
                const data = d.data();
                total += parseFloat(data.monto); count++;
                body.innerHTML += `<tr><td>${data.usuario}</td><td>${data.nivel}</td><td>${data.fecha_inicio}</td><td>${data.fecha_vencimiento}</td><td><span class="status-badge">${data.estado}</span></td></tr>`;
            });
            document.getElementById('total_ganado').innerText = `$ ${total} MXN`;
            document.getElementById('total_alumnos').innerText = count;
        });
    </script>
</body>
</html>
