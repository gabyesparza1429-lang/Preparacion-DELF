<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Objectif Réussite</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --oxford-blue: #002147; --gold: #C5A059; }
        body { font-family: 'Montserrat', sans-serif; background: #f4f7f9; margin: 0; padding: 20px; }
        .admin-container { max-width: 500px; margin: 40px auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h2 { color: var(--oxford-blue); text-align: center; }
        label { display: block; margin-top: 15px; font-weight: bold; color: var(--oxford-blue); }
        input, select { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .btn-save { background: var(--oxford-blue); color: white; border: none; width: 100%; padding: 15px; margin-top: 25px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1rem; }
        .btn-save:hover { background: var(--gold); }
        .back-link { display: block; text-align: center; margin-top: 20px; color: #666; text-decoration: none; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="admin-container">
        <h2>Panel de Administración</h2>
        <p style="text-align: center; font-size: 0.9rem; color: #666;">Registrar nuevo alumno</p>
        
        <form id="adminForm">
            <label>Nom de l'étudiant :</label>
            <input type="text" id="nombreAlumno" placeholder="Ej: Sergio A H" required>

            <label>Mot de passe (PIN) :</label>
            <input type="text" id="passAlumno" placeholder="Ej: 1234" required>

            <label>Niveau :</label>
            <select id="nivelAlumno">
                <option value="A1">A1 - Découverte</option>
                <option value="A2">A2 - Survie</option>
                <option value="B1">B1 - Seuil</option>
                <option value="B2">B2 - Indépendant</option>
                <option value="C1">C1 - Autonome</option>
            </select>

            <button type="submit" class="btn-save">ENREGISTRER L'ÉTUDIANT</button>
        </form>

        <a href="index.html" class="back-link">← Volver al inicio</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCgog8tKspHy01ZHE8Dthl9O4W6lw1a_Ec",
            authDomain: "objectif-reussite-delf.firebaseapp.com",
            projectId: "objectif-reussite-delf",
            storageBucket: "objectif-reussite-delf.firebasestorage.app",
            messagingSenderId: "942279633770",
            appId: "1:942279633770:web:9d7b5fe54d0139019c1313"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.getElementById('adminForm').onsubmit = async (e) => {
            e.preventDefault();
            
            const nombre = document.getElementById('nombreAlumno').value;
            const clave = document.getElementById('passAlumno').value;
            const nivel = document.getElementById('nivelAlumno').value;

            try {
                // Guardamos en Firebase con el nombre y la contraseña que tú elijas
                await setDoc(doc(db, "Usuarios", nombre), {
                    usuario: nombre,
                    password: clave,
                    nivel: nivel,
                    fecha_registro: new Date().toISOString().split('T')[0]
                });

                alert(`¡Éxito! ${nombre} ha sido registrado en el nivel ${nivel} con la clave ${clave}.`);
                document.getElementById('adminForm').reset();
            } catch (error) {
                console.error(error);
                alert("Error al guardar en la base de datos.");
            }
        };
    </script>
</body>
</html>
