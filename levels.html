<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroRéussit - Niveaux</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --oxford: #002147;
            --gold: #C5A059;
            --white: #ffffff;
            --light-bg: #f4f7f9;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            background-color: var(--light-bg);
            color: var(--oxford);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header p {
            color: var(--gold);
            font-weight: bold;
            letter-spacing: 1px;
            margin: 0;
        }

        .container {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            padding: 20px;
            max-width: 1200px;
        }

        .level-card {
            background: var(--white);
            width: 160px;
            height: 160px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: inherit;
            transition: transform 0.3s, box-shadow 0.3s;
            border: 2px solid transparent;
        }

        .level-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
            border-color: var(--gold);
        }

        .level-name {
            font-size: 2.5rem;
            font-weight: 700;
            margin: 0;
            color: var(--oxford);
        }

        .level-desc {
            font-size: 0.85rem;
            color: #7f8c8d;
            margin-top: 5px;
            font-weight: 400;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Choisissez votre niveau</h1>
        <p>SELECCIONA TU NIVEL</p>
    </div>

    <div class="container">
        <!-- Nivel A1 -->
        <a href="units.html?level=A1" class="level-card">
            <h2 class="level-name">A1</h2>
            <span class="level-desc">Découverte</span>
        </a>

        <!-- Nivel A2 -->
        <a href="units.html?level=A2" class="level-card">
            <h2 class="level-name">A2</h2>
            <span class="level-desc">Survie</span>
        </a>

        <!-- Nivel B1 -->
        <a href="units.html?level=B1" class="level-card">
            <h2 class="level-name">B1</h2>
            <span class="level-desc">Seuil</span>
        </a>

        <!-- Nivel B2 -->
        <a href="units.html?level=B2" class="level-card">
            <h2 class="level-name">B2</h2>
            <span class="level-desc">Avancé</span>
        </a>

        <!-- Nivel C1 -->
        <a href="units.html?level=C1" class="level-card">
            <h2 class="level-name">C1</h2>
            <span class="level-desc">Autonome</span>
        </a>
    </div>

</body>
</html>
