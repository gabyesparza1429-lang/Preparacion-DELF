<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Objectif Réussite - Niveaux</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --oxford: #002147;
            --gold: #C5A059;
            --white: #ffffff;
            --light-bg: #f4f7f9;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            background-color: var(--light-bg);
            color: var(--oxford);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* BARRA SUPERIOR LIMPIA */
        .navbar {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: flex-start;
            padding: 20px;
            box-sizing: border-box;
        }

        .nav-logo {
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* CONTENEDOR DEL BANNER PRINCIPAL */
        .banner-container {
            width: 90%;
            max-width: 1100px;
            margin-top: 10px;
            margin-bottom: 40px;
        }

        .banner-img {
            width: 100%;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            display: block;
        }

        /* CONTENEDOR DE TARJETAS DE NIVEL */
        .container {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            padding: 20px;
            width: 100%;
            max-width: 1100px;
            box-sizing: border-box;
        }

        /* LAS TARJETAS YA NO TIENEN ACCESO LIBRE, TE MANDAN AL LOGIN */
        .level-card {
            background: var(--oxford);
            width: 180px;
            height: 240px;
            border-radius: 18px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: var(--white);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .level-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
        }

        /* CLASE ESPECIAL EXCLUSIVA PARA EL C1 EN ORO */
        .level-card.c1-gold {
            background: var(--gold);
            color: var(--oxford);
        }

        .level-name {
            font-size: 2.8rem;
            font-weight: 700;
            margin: 0;
        }

        .level-desc {
            font-size: 0.75rem;
            margin-top: 15px;
            letter-spacing: 1px;
            text-transform: uppercase;
            opacity: 0.8;
            font-weight: 400;
        }

        .c1-gold .level-desc {
            color: var(--oxford);
            opacity: 0.7;
        }

        /* PIE DE PÁGINA */
        .footer-text {
            font-size: 0.85rem;
            color: #7f8c8d;
            font-style: italic;
            margin-top: 50px;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="nav-logo">Objectif Réussite</div>
    </div>

    <div class="banner-container">
        <img src="./assets/Banner.png" alt="Objectif Réussite DELF" class="banner-img">
    </div>

    <div class="container">
        <a href="login.html?level=A1" class="level-card">
            <h2 class="level-name">A1</h2>
            <span class="level-desc">Découverte</span>
        </a>

        <a href="login.html?level=A2" class="level-card">
            <h2 class="level-name">A2</h2>
            <span class="level-desc">Survie</span>
        </a>

        <a href="login.html?level=B1" class="level-card">
            <h2 class="level-name">B1</h2>
            <span class="level-desc">Seuil</span>
        </a>

        <a href="login.html?level=B2" class="level-card">
            <h2 class="level-name">B2</h2>
            <span class="level-desc">Indépendant</span>
        </a>

        <a href="login.html?level=C1" class="level-card c1-gold">
            <h2 class="level-name">C1</h2>
            <span class="level-desc">Autonome</span>
        </a>
    </div>

    <div class="footer-text">De la intención a la certificación.</div>

</body>
</html>
